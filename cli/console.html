<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kc 工作台</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --panel: #fff;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --accent: #1d4ed8;
      --ok: #166534;
      --bad: #b91c1c;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: "Source Han Sans SC", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
    body { display: flex; flex-direction: column; }
    header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 15px; font-weight: 650; }
    header p { margin: 0; color: var(--muted); font-size: 12.5px; }
    header code { font-family: var(--mono); font-size: 12px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
    .as { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
    .as input, select, textarea, button.act {
      font: 13px var(--sans);
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
    }
    .as input { font-family: var(--mono); padding: 4px 8px; width: 9rem; }
    .as input#requestId { width: 8rem; }
    button.act { padding: 5px 11px; cursor: pointer; }
    button.act.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.act:disabled { opacity: .45; cursor: default; }
    .layout { flex: 1; display: grid; grid-template-columns: 280px minmax(0, 1.15fr) minmax(0, 0.95fr); min-height: 0; }
    .pane { overflow: auto; background: var(--panel); }
    .pane + .pane { border-left: 1px solid var(--line); }
    .pane h2 {
      margin: 0; padding: 8px 12px;
      font-size: 11px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
      color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg);
      position: sticky; top: 0;
    }
    .tree { padding: 8px 6px 24px; font: 12.5px/1.4 var(--mono); }
    .tree .kind { margin: 10px 6px 4px; font: 11px var(--sans); color: var(--muted); }
    .tree details { margin-left: 8px; }
    .tree summary { cursor: pointer; list-style: none; }
    .tree summary::-webkit-details-marker { display: none; }
    .tree button.file {
      display: block; width: 100%; text-align: left; border: 0; background: transparent;
      color: inherit; font: inherit; padding: 2px 6px; border-radius: 4px; cursor: pointer;
    }
    .tree button.file:hover, .tree button.file.on { background: #e8eefc; color: var(--accent); }
    .meta { color: var(--muted); font-size: 11px; margin-left: 6px; font-family: var(--sans); }
    .work { padding: 12px 14px 28px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    select#verb { font-family: var(--mono); padding: 5px 8px; min-width: 11rem; }
    textarea#flags {
      width: 100%; min-height: 220px; flex: 1;
      font: 12.5px/1.45 var(--mono); padding: 10px 12px; resize: vertical;
    }
    .samples { display: flex; flex-wrap: wrap; gap: 6px; }
    .samples button {
      font: 12px var(--sans); border: 1px solid var(--line); background: var(--bg);
      border-radius: 999px; padding: 3px 9px; cursor: pointer; color: var(--ink);
    }
    .samples button:hover { border-color: var(--accent); color: var(--accent); }
    .note { color: var(--muted); font-size: 12.5px; }
    pre, .doc {
      margin: 0; padding: 12px 14px; overflow: auto;
      font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word;
      background: #1c1917; color: #e7e5e4; flex: 1; min-height: 0;
    }
    pre.err, .doc.err { outline: 1px solid #7f1d1d; }
    .split { display: flex; flex-direction: column; min-height: 0; }
    .viewblock { flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .viewblock + .viewblock { border-top: 1px solid var(--line); }
    .viewblock h2 { position: sticky; top: 0; z-index: 1; display: flex; gap: 8px; align-items: center; }
    .viewblock h2 .path { text-transform: none; letter-spacing: 0; font: 11px var(--mono); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .bar { padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; gap: 8px; flex-wrap: wrap; }
    .bar:empty { display: none; }
    .jk { color: #93c5fd; }
    .js { color: #86efac; }
    .jn { color: #fdba74; }
    .jl { color: #c4b5fd; }
    .fm { color: #a8a29e; }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1>kc 工作台</h1>
    <p>左侧只列 Catalog 允许访问的内容。样例只填表，不限制操作。</p>
    <div class="as">
      <span id="homeLabel"></span>
      <span>--as</span>
      <input id="as" placeholder="空 = 主人">
      <span>--request-id</span>
      <input id="requestId" placeholder="可选关联">
      <button class="act" id="refresh">刷新树</button>
    </div>
  </header>
  <div class="layout">
    <div class="pane">
      <h2>可访问内容</h2>
      <div class="tree" id="tree">尚未加载</div>
    </div>
    <div class="pane work">
      <h2 style="margin: -12px -14px 4px; position: static;">发命令</h2>
      <div class="row">
        <select id="verb"></select>
        <button class="act" id="newId">新 command-id</button>
        <button class="act primary" id="run">执行</button>
      </div>
      <p class="note">JSON 旗标与 CLI 相同（不要 -- 前缀，不要 home）。点样例会写入编辑器，仍可改。</p>
      <div class="samples" id="samples"></div>
      <textarea id="flags" spellcheck="false">{
  "catalog": "acme/catalog"
}</textarea>
    </div>
    <div class="pane split">
      <div class="viewblock">
        <h2>选中文件 <span class="path" id="previewPath"></span></h2>
        <div class="bar" id="previewBar"></div>
        <pre class="doc" id="preview">点左侧文件查看正文。</pre>
      </div>
      <div class="viewblock">
        <h2>上次输出 <span class="path" id="outMeta"></span></h2>
        <pre class="doc" id="out">尚未请求。</pre>
      </div>
    </div>
  </div>
  <script>
    const VERBS = [
      "init","catalog-add","register","status","audit","repo-add",
      "put","remove","commit","ingest","receipt","append",
      "resolve","read","provenance","stream","list","describe-schema","log","diff",
      "define-view","index-plan",
      "retire-view","archive-catalog","archive-repo",
      "allow","revoke","allowed","whoami",
      "propose","preview","validate","record-validation","merge",
      "hook-add","hook-ls","hook-rm","gate-add","gate-ls","gate-rm"
    ];
    const ALICE = "kr://acme/personals/alice";
    const OBJ = "runbooks/payment-oncall";
    const SAMPLES = [
      { label: "init acme/catalog", verb: "init", flags: { catalog: "acme/catalog" } },
      { label: "audit", verb: "audit", flags: {} },
      { label: "repo-add alice", verb: "repo-add", flags: { repo: ALICE } },
      { label: "put 值班", verb: "put", flags: { "command-id": "$ID", repo: ALICE, object: OBJ, value: { text: "切换流量前先检查冻结窗口" }, "origin-kind": "SOURCE" } },
      { label: "read", verb: "read", flags: { repo: ALICE, object: OBJ, ref: "refs/heads/main" } },
      { label: "list", verb: "list", flags: { repo: ALICE, ref: "refs/heads/main" } },
      { label: "provenance", verb: "provenance", flags: { repo: ALICE, object: OBJ, ref: "refs/heads/main" } },
      { label: "define-view", verb: "define-view", flags: { view: "payments-agent", revision: 1, source: ALICE + "=refs/heads/main" } },
      { label: "read --catalog", verb: "read", flags: { catalog: "kr://acme/catalog" } },
      { label: "read --view", verb: "read", flags: { view: "payments-agent", object: OBJ } },
      { label: "append", verb: "append", flags: { "command-id": "$ID", repo: ALICE, stream: "evidence", "event-id": "evt-1", payload: { outcome: "PASSED" } } },
      { label: "propose", verb: "propose", flags: { "proposal-id": "PR-42", repo: ALICE, target: "refs/heads/main", candidate: "refs/heads/candidates/PR-42", object: OBJ, value: { text: "候选正文" } } },
      { label: "preview", verb: "preview", flags: { proposal: "PR-42", view: "payments-agent" } },
      { label: "validate", verb: "validate", flags: { preview: "" } },
      { label: "merge", verb: "merge", flags: { proposal: "PR-42", preview: "", validation: "" } }
    ];

    const $ = (id) => document.getElementById(id);
    let state = null;
    let selected = null;

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function highlightJson(src) {
      return escapeHtml(src).replace(
        /("(?:\\.|[^"\\])*")\s*:|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|("(?:\\.|[^"\\])*")/g,
        (m, key, lit, num, str) => {
          if (key) return '<span class="jk">' + key + '</span>:';
          if (lit) return '<span class="jl">' + lit + '</span>';
          if (num) return '<span class="jn">' + num + '</span>';
          return '<span class="js">' + str + '</span>';
        }
      );
    }
    function prettyJson(value) {
      return highlightJson(JSON.stringify(value, null, 2));
    }
    function looksJson(s) {
      const t = s.trim();
      return t.startsWith("{") || t.startsWith("[");
    }
    function formatText(raw) {
      if (raw == null) return "";
      if (typeof raw !== "string") return prettyJson(raw);
      const text = raw.replace(/\r\n/g, "\n");
      const t = text.trim();
      if (t.startsWith("---")) {
        const close = t.indexOf("\n---", 3);
        if (close >= 0) {
          const after = t.slice(close + 4);
          const fm = t.slice(0, close + 4).trimEnd();
          const body = after.replace(/^\n/, "").trim();
          let prettyBody = escapeHtml(body);
          try { prettyBody = prettyJson(JSON.parse(body)); } catch {}
          return '<span class="fm">' + escapeHtml(fm) + '</span>\n\n' + prettyBody;
        }
      }
      const lines = text.split("\n");
      const nonempty = lines.filter((l) => l.trim());
      if (nonempty.length > 1 && nonempty.every(looksJson)) {
        return nonempty.map((line) => {
          try { return prettyJson(JSON.parse(line)); } catch { return escapeHtml(line); }
        }).join("\n\n");
      }
      try { return prettyJson(JSON.parse(t)); } catch { return escapeHtml(text); }
    }
    function showDoc(el, raw, err) {
      el.className = "doc" + (err ? " err" : "");
      el.innerHTML = formatText(raw) || escapeHtml(String(raw || ""));
    }
    function asHeader() {
      const h = {};
      const v = $("as").value.trim();
      if (v) h["X-Kc-As"] = v;
      const r = $("requestId").value.trim();
      if (r) h["X-Kc-Request-Id"] = r;
      return h;
    }
    function stamp(flags) {
      const out = JSON.parse(JSON.stringify(flags || {}));
      if (out["command-id"] === "$ID") out["command-id"] = "c-" + Date.now();
      return out;
    }
    function fillVerb(name) {
      $("verb").value = name;
    }
    function fillFlags(obj) {
      $("flags").value = JSON.stringify(obj, null, 2);
    }

    VERBS.forEach((v) => {
      const o = document.createElement("option");
      o.value = v; o.textContent = v;
      $("verb").appendChild(o);
    });
    $("verb").value = "init";
    SAMPLES.forEach((s) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = s.label;
      b.title = s.verb;
      b.onclick = () => { fillVerb(s.verb); fillFlags(stamp(s.flags)); };
      $("samples").appendChild(b);
    });

    function fileBtn(label, title, onClick) {
      const b = document.createElement("button");
      b.className = "file";
      b.textContent = label;
      b.title = title || label;
      b.onclick = onClick;
      return b;
    }

    function folder(name, open) {
      const d = document.createElement("details");
      d.open = open !== false;
      const s = document.createElement("summary");
      s.textContent = name;
      d.appendChild(s);
      return d;
    }

    function splitKey(s) {
      const raw = String(s || "").replace(/^\/+/, "");
      if (!raw) return [];
      const kr = raw.indexOf("kr://");
      if (kr < 0) return raw.split("/").filter(Boolean);
      const parts = raw.slice(0, kr).split("/").filter(Boolean);
      parts.push(raw.slice(kr));
      return parts;
    }

    function nestTree(entries) {
      const root = {};
      (entries || []).forEach((e) => {
        const parts = splitKey(e.key);
        if (!parts.length) return;
        let node = root;
        parts.forEach((p, i) => {
          if (i === parts.length - 1) {
            node.__files = node.__files || [];
            node.__files.push({ label: p, title: e.title || e.key, open: e.open });
            return;
          }
          node[p] = node[p] || {};
          node = node[p];
        });
      });
      const wrap = document.createElement("div");
      function walk(obj, el) {
        Object.keys(obj).sort().forEach((k) => {
          if (k === "__files") return;
          const d = folder(k, true);
          walk(obj[k], d);
          el.appendChild(d);
        });
        (obj.__files || []).sort((a, b) => a.label.localeCompare(b.label)).forEach((f) => {
          el.appendChild(fileBtn(f.label, f.title, f.open));
        });
      }
      walk(root, wrap);
      if (!wrap.childNodes.length) {
        const p = document.createElement("div");
        p.className = "meta";
        p.textContent = "（空）";
        wrap.appendChild(p);
      }
      return wrap;
    }

    function renderTree() {
      const el = $("tree");
      el.innerHTML = "";
      const tree = (state && state.tree) || {};
      $("homeLabel").textContent = (state && state.home) ? state.home : "";
      const roots = tree.roots || [];
      if (!roots.length) {
        el.textContent = "空 home。选 init 或自己写命令。";
        return;
      }
      roots.forEach((r) => {
        const top = folder(r.id + (r.archived ? " archived" : ""), true);
        const entries = [];
        (r.files || []).forEach((f) => {
          entries.push({
            key: f.objectId || f.path,
            title: f.objectId || f.path,
            open: () => openBlob(r.dir, "HEAD", f.path, r.id)
          });
        });
        (r.streams || []).forEach((s) => {
          const name = s.name.endsWith(".jsonl") ? s.name : s.name + ".jsonl";
          entries.push({
            key: "streams/" + name,
            title: s.file,
            open: () => openSidecar(s.file)
          });
        });
        top.appendChild(nestTree(entries));
        el.appendChild(top);
      });
    }

    async function openSidecar(path) {
      selected = { path };
      $("previewPath").textContent = path;
      $("previewBar").innerHTML = "";
      const res = await fetch("/v1/_blob?" + new URLSearchParams({ path }));
      const data = await res.json();
      showDoc($("preview"), data.text != null ? data.text : data, !res.ok);
    }
    async function openBlob(dir, ref, path, repoId) {
      selected = { dir, ref, path, repoId };
      $("previewPath").textContent = path;
      const res = await fetch("/v1/_blob?" + new URLSearchParams({ dir, ref, path }));
      const data = await res.json();
      if (data.objectId) $("previewPath").textContent = data.objectId;
      showDoc($("preview"), data.text != null ? data.text : data, !res.ok);
      const bar = $("previewBar");
      bar.innerHTML = "";
      if (data.objectId && repoId) {
        const hint = document.createElement("button");
        hint.className = "act";
        hint.textContent = "填入 read " + data.objectId;
        hint.onclick = () => {
          fillVerb("read");
          fillFlags({ repo: repoId, object: data.objectId, ref: "refs/heads/main" });
        };
        bar.appendChild(hint);
      }
    }

    async function refresh() {
      const res = await fetch("/v1/_state", { headers: asHeader() });
      state = await res.json();
      renderTree();
    }

    $("run").onclick = async () => {
      let flags;
      try { flags = JSON.parse($("flags").value || "{}"); }
      catch (e) {
        $("outMeta").textContent = "JSON 无效";
        showDoc($("out"), e.message, true);
        return;
      }
      const verb = $("verb").value;
      $("run").disabled = true;
      try {
        const res = await fetch("/v1/" + verb, {
          method: "POST",
          headers: Object.assign({ "Content-Type": "application/json" }, asHeader()),
          body: JSON.stringify(flags)
        });
        const text = await res.text();
        let data; try { data = JSON.parse(text); } catch { data = text; }
        $("outMeta").textContent = "POST /v1/" + verb + "  " + res.status;
        showDoc($("out"), data, !res.ok);
        await refresh();
      } finally {
        $("run").disabled = false;
      }
    };
    $("newId").onclick = () => {
      let flags = {};
      try { flags = JSON.parse($("flags").value || "{}"); } catch { return; }
      flags["command-id"] = "c-" + Date.now();
      fillFlags(flags);
    };
    $("refresh").onclick = refresh;
    $("verb").addEventListener("change", () => {});
    refresh();
  </script>
</body>
</html>
