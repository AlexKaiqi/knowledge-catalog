# Run from docs/observability: promtool test rules prometheus-recording-rules-tests.yaml
# Fixtures require no running Server or Prometheus. See https://prometheus.io/docs/prometheus/latest/configuration/unit_testing_rules/
# All-error groups deliberately have no success series; zero/absent eligible traffic must stay without SLI samples.
rule_files:
  - prometheus-recording-rules.yaml
  - prometheus-alert-rules.yaml
evaluation_interval: 30s
group_eval_order:
  - kc-sli-5m
  - kc-search-slo-burn
  - kc-journey-sli-5m
  - kc-read-slo-burn
  - kc-writer-slo-burn
  - kc-error-budget-30d
  - kc-reference-alerts
tests:
  - name: only_error_series
    interval: 30s
    input_series:
      - series: "kc_search_requests_total{kc_retrieval_provider=\"opensearch\",kc_outcome=\"error\"}"
        values: "0+10x20"
      - series: "kc_operation_executions_total{kc_face=\"knowledge\",kc_operation=\"knowledge-read\",kc_outcome=\"error\"}"
        values: "0+10x20"
      - series: "kc_writer_commands_total{kc_writer_surface=\"COMMIT\",kc_outcome=\"error\"}"
        values: "0+10x20"
      - series: "kc_evidence_appends_total{kc_evidence_kind=\"access\",kc_outcome=\"error\"}"
        values: "0+10x20"
      - series: "kc_binding_lookups_total{kc_binding_mode=\"state\",kc_outcome=\"error\"}"
        values: "0+10x20"
    promql_expr_test:
      - expr: "kc:sli:search_availability:ratio"
        eval_time: 10m
        exp_samples:
          - labels: "kc:sli:search_availability:ratio{kc_retrieval_provider=\"opensearch\"}"
            value: 0
      - expr: "kc:slo:search_availability:error_ratio5m"
        eval_time: 10m
        exp_samples:
          - labels: "kc:slo:search_availability:error_ratio5m{kc_retrieval_provider=\"opensearch\"}"
            value: 1
      - expr: "kc:slo:search_availability:burn_rate5m"
        eval_time: 10m
        exp_samples:
          - labels: "kc:slo:search_availability:burn_rate5m{kc_retrieval_provider=\"opensearch\"}"
            value: 200
      - expr: "kc:slo:search_availability:error_ratio30m"
