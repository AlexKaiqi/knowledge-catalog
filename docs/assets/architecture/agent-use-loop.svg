<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1100" viewBox="0 0 1720 1100" role="img" aria-labelledby="title description">
  <title id="title">Agent 使用闭环：从发现到可核验结果与修订</title>
  <desc id="description">六步设计闭环：发现对象与可供性、理解并固定依据、核对当前权限与执行条件、执行并核验结果、使用见证与释放、反馈修订再发现。权限不足时进入资源 owner 的外部授权流程；这属于设计闭环目标，不表示平台托管审批或自动发权。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62748A"/></marker>
    <marker id="future-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8971AA"/></marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Hiragino Sans GB', sans-serif; fill: #203247; }
    .muted { fill: #65778C; }
    .code { font-family: Menlo, monospace; fill: #65778C; }
    .connector { fill: none; stroke: #62748A; stroke-width: 2.3; stroke-linejoin: round; marker-end: url(#arrow); }
    .future-connector { fill: none; stroke: #8971AA; stroke-width: 2.3; stroke-dasharray: 8 6; stroke-linejoin: round; marker-end: url(#future-arrow); }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g id="heading">
    <text x="50" y="72" font-size="43" font-weight="600" text-anchor="start">Agent 使用闭环｜从发现到可核验结果与修订</text>
    <text x="50" y="116" font-size="25" font-weight="400" text-anchor="start" class="muted">任务顺序与责任交接 · 固定知识依据和当前授权共同成立</text>
  </g>
  <g id="discover">
    <rect x="50" y="210" width="480" height="205" rx="12" fill="#EDF4FF" stroke="#C3D3E5" stroke-width="1.5"/>
    <rect x="72" y="232" width="38" height="38" rx="8" fill="#FFFFFF" stroke="#C7D6E7" stroke-width="1.5"/>
    <text x="91" y="259" font-size="25" font-weight="600" text-anchor="middle">1</text>
    <text x="127" y="260" font-size="28" font-weight="600" text-anchor="start">发现对象与可供性</text>
    <text x="76" y="306" font-size="24" font-weight="400" text-anchor="start">库存、查询、关系与 help</text>
    <text x="76" y="347" font-size="24" font-weight="400" text-anchor="start">取得对象供给和系统能力说明</text>
    <text x="76" y="388" font-size="24" font-weight="400" text-anchor="start">发现说明不执行所述能力</text>
  </g>
  <g id="understand">
    <rect x="620" y="210" width="480" height="205" rx="12" fill="#EDF4FF" stroke="#C3D3E5" stroke-width="1.5"/>
    <rect x="642" y="232" width="38" height="38" rx="8" fill="#FFFFFF" stroke="#C7D6E7" stroke-width="1.5"/>
    <text x="661" y="259" font-size="25" font-weight="600" text-anchor="middle">2</text>
    <text x="697" y="260" font-size="28" font-weight="600" text-anchor="start">理解并固定依据</text>
    <text x="646" y="306" font-size="24" font-weight="400" text-anchor="start">Reference · Schema · 发布版本</text>
    <text x="646" y="347" font-size="24" font-weight="400" text-anchor="start">确认明确实现与输入结果合同</text>
    <text x="646" y="388" font-size="24" font-weight="400" text-anchor="start">保留来源、材料和观察依据</text>
  </g>
  <g id="authorize">
    <rect x="1190" y="210" width="480" height="205" rx="12" fill="#EDF4FF" stroke="#C3D3E5" stroke-width="1.5"/>
    <rect x="1212" y="232" width="38" height="38" rx="8" fill="#FFFFFF" stroke="#C7D6E7" stroke-width="1.5"/>
    <text x="1231" y="259" font-size="25" font-weight="600" text-anchor="middle">3</text>
    <text x="1267" y="260" font-size="28" font-weight="600" text-anchor="start">确认访问与执行条件</text>
    <text x="1216" y="306" font-size="24" font-weight="400" text-anchor="start">Server 核对实际主体、动作与范围</text>
    <text x="1216" y="347" font-size="24" font-weight="400" text-anchor="start">检查支持、就绪与当前权限</text>
    <text x="1216" y="388" font-size="24" font-weight="400" text-anchor="start">外部资源仍检查源方授权</text>
  </g>
  <g id="execute">
    <rect x="1190" y="720" width="480" height="205" rx="12" fill="#EDF7F7" stroke="#C3D3E5" stroke-width="1.5"/>
    <rect x="1212" y="742" width="38" height="38" rx="8" fill="#FFFFFF" stroke="#C7D6E7" stroke-width="1.5"/>
    <text x="1231" y="769" font-size="25" font-weight="600" text-anchor="middle">4</text>
    <text x="1267" y="770" font-size="28" font-weight="600" text-anchor="start">执行并核验结果</text>
    <text x="1216" y="816" font-size="24" font-weight="400" text-anchor="start">按固定合同调用 Reader / Plugin</text>
    <text x="1216" y="857" font-size="24" font-weight="400" text-anchor="start">区分成功、失败与结果未知</text>
    <text x="1216" y="898" font-size="24" font-weight="400" text-anchor="start">无法兑现保证时明确失败</text>
  </g>
  <g id="use-witness-release">
    <rect x="620" y="720" width="480" height="205" rx="12" fill="#EDF7F7" stroke="#C3D3E5" stroke-width="1.5"/>
    <rect x="642" y="742" width="38" height="38" rx="8" fill="#FFFFFF" stroke="#C7D6E7" stroke-width="1.5"/>
    <text x="661" y="769" font-size="25" font-weight="600" text-anchor="middle">5</text>
    <text x="697" y="770" font-size="28" font-weight="600" text-anchor="start">使用、见证与释放</text>
    <text x="646" y="816" font-size="24" font-weight="400" text-anchor="start">成果引用实际知识与观察依据</text>
    <text x="646" y="857" font-size="24" font-weight="400" text-anchor="start">持有临时资源时按合同释放</text>
    <text x="646" y="898" font-size="24" font-weight="400" text-anchor="start">区分模型推断与已发布知识</text>
  </g>
  <g id="feedback">
    <rect x="50" y="720" width="480" height="205" rx="12" fill="#EDF7F7" stroke="#C3D3E5" stroke-width="1.5"/>
    <rect x="72" y="742" width="38" height="38" rx="8" fill="#FFFFFF" stroke="#C7D6E7" stroke-width="1.5"/>
    <text x="91" y="769" font-size="25" font-weight="600" text-anchor="middle">6</text>
    <text x="127" y="770" font-size="28" font-weight="600" text-anchor="start">反馈并修订</text>
    <text x="76" y="816" font-size="24" font-weight="400" text-anchor="start">问题定位到具体内容与使用依据</text>
    <text x="76" y="857" font-size="24" font-weight="400" text-anchor="start">经 Writer 或提案显式发布新版</text>
    <text x="76" y="898" font-size="24" font-weight="400" text-anchor="start">保留历史引用与版本可复核性</text>
  </g>
  <g id="task-sequence">
    <path class="connector" d="M 530 312 L 620 312"/>
    <path class="connector" d="M 1100 312 L 1190 312"/>
    <path class="connector" d="M 1430 415 L 1430 720"/>
    <text x="1453" y="574" font-size="23" font-weight="400" text-anchor="start" class="muted">获准后使用</text>
    <path class="connector" d="M 1190 822 L 1100 822"/>
    <path class="connector" d="M 620 822 L 530 822"/>
    <path class="connector" d="M 290 720 L 290 415"/>
    <text x="315" y="574" font-size="23" font-weight="400" text-anchor="start" class="muted">再发现新版</text>
  </g>
  <g id="external-authorization-goal">
    <rect x="650" y="493" width="450" height="159" rx="12" fill="#FCFAFF" stroke="#BCAACE" stroke-width="1.5" stroke-dasharray="8 6"/>
    <text x="675" y="533" font-size="25" font-weight="500" text-anchor="start">权限不足：查明外部申请路径</text>
    <text x="675" y="569" font-size="24" font-weight="400" text-anchor="start">资源 owner 决定并显式发权</text>
    <text x="675" y="605" font-size="23" font-weight="400" text-anchor="start">获准后重新执行授权检查</text>
    <text x="675" y="635" font-size="20" font-weight="400" text-anchor="start" class="muted">设计闭环目标 · 平台不托管审批</text>
    <path class="future-connector" d="M 1190 360 L 1150 360 L 1150 555 L 1100 555"/>
  </g>
  <g id="cross-cutting-guarantees">
    <rect x="50" y="983" width="1620" height="71" rx="12" fill="#F6F8FB" stroke="#D5DFE9" stroke-width="1.5"/>
    <text x="76" y="1027" font-size="25" font-weight="600" text-anchor="start">贯穿保证</text>
    <text x="236" y="1027" font-size="26" font-weight="400" text-anchor="start">逐次授权 · 固定范围 · 输入结果核验 · 访问证据 · 按合同恢复</text>
  </g>
</svg>
