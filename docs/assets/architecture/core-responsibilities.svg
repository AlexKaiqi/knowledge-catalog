<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1370" viewBox="0 0 1720 1370" role="img" aria-labelledby="title description">
  <title id="title">Knowledge Catalog：核心保证与扩展边界</title>
  <desc id="description">设计职责图。人、应用、Agent、Web、kcfs 与墙外采集器经 Server 进入同一受控任务边界。Object 解释知识，Snapshot 保存固定内容并承接仓与 Dataset 权限；按来源仓采用索引和 LiveAccess 插件。索引可重建，外部资源不成为 Snapshot 权威。Affordance 横向描述对象供给与系统能力。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62748A"/></marker>
    <marker id="future-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8971AA"/></marker>
  </defs>
  <style>
    text { font-family: 'PingFang SC', 'Hiragino Sans GB', sans-serif; fill: #203247; }
    .muted { fill: #65778C; }
    .code { font-family: Menlo, monospace; fill: #65778C; }
    .connector { fill: none; stroke: #62748A; stroke-width: 2.3; stroke-linejoin: round; marker-end: url(#arrow); }
    .future-connector { fill: none; stroke: #8971AA; stroke-width: 2.3; stroke-dasharray: 8 6; stroke-linejoin: round; marker-end: url(#future-arrow); }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <g id="heading">
    <text x="50" y="72" font-size="43" font-weight="600" text-anchor="start">Knowledge Catalog｜核心保证与扩展边界</text>
    <text x="50" y="116" font-size="25" font-weight="400" text-anchor="start" class="muted">设计职责视图 · 稳定核心独立成立 · 按任务采用扩展</text>
  </g>
  <g id="entrypoints">
    <rect x="50" y="153" width="630" height="126" rx="12" fill="#F6F8FB" stroke="#D5DFE9" stroke-width="1.5"/>
    <text x="76" y="199" font-size="30" font-weight="600" text-anchor="start">人 / 应用 / Agent</text>
    <text x="76" y="244" font-size="24" font-weight="400" text-anchor="start">统一 CLI 与模块 SDK · 全局身份与任务上下文</text>
    <rect x="710" y="153" width="380" height="126" rx="12" fill="#F6F8FB" stroke="#D5DFE9" stroke-width="1.5"/>
    <text x="736" y="199" font-size="30" font-weight="600" text-anchor="start">Web / kcfs</text>
    <text x="736" y="244" font-size="24" font-weight="400" text-anchor="start">控制台与只读文件交付</text>
    <rect x="1120" y="153" width="560" height="126" rx="12" fill="#FFF8ED" stroke="#DBC8A8" stroke-width="1.5"/>
    <text x="1146" y="199" font-size="30" font-weight="600" text-anchor="start">墙外接入方运行时</text>
    <text x="1146" y="235" font-size="22" font-weight="400" text-anchor="start" class="code">integrationruntime / Collector</text>
    <text x="1146" y="263" font-size="22" font-weight="400" text-anchor="start">来源采集与对账 → typed Writer 显式发布</text>
    <path class="connector" d="M 365 279 L 365 345"/>
    <path class="connector" d="M 900 279 L 900 345"/>
    <path class="connector" d="M 1400 279 L 1400 345"/>
  </g>
  <g id="shared-server-boundary">
    <rect x="50" y="345" width="1630" height="171" rx="12" fill="#EDF7F7" stroke="#B6D4D6" stroke-width="1.5"/>
    <text x="76" y="391" font-size="31" font-weight="600" text-anchor="start">Server｜共同请求保证</text>
    <text x="1654" y="391" font-size="22" font-weight="400" text-anchor="end" class="muted">home：按配置装配与生命周期</text>
    <rect x="76" y="415" width="384" height="80" rx="8" fill="#FFFFFF" stroke="#C8DFE1" stroke-width="1.5"/>
    <text x="93" y="447" font-size="24" font-weight="500" text-anchor="start">认证与调用上下文</text>
    <text x="93" y="478" font-size="22" font-weight="400" text-anchor="start" class="muted">实际主体 · 固定目标与范围</text>
    <rect x="474" y="415" width="384" height="80" rx="8" fill="#FFFFFF" stroke="#C8DFE1" stroke-width="1.5"/>
    <text x="491" y="447" font-size="24" font-weight="500" text-anchor="start">当前授权检查</text>
    <text x="491" y="478" font-size="22" font-weight="400" text-anchor="start" class="muted">平台范围 · 外部来源权限</text>
    <rect x="872" y="415" width="384" height="80" rx="8" fill="#FFFFFF" stroke="#C8DFE1" stroke-width="1.5"/>
    <text x="889" y="447" font-size="24" font-weight="500" text-anchor="start">同源任务执行</text>
    <text x="889" y="478" font-size="22" font-weight="400" text-anchor="start" class="muted">所属模块持有业务规则</text>
    <rect x="1270" y="415" width="384" height="80" rx="8" fill="#FFFFFF" stroke="#C8DFE1" stroke-width="1.5"/>
    <text x="1287" y="447" font-size="24" font-weight="500" text-anchor="start">记录与可靠交付</text>
    <text x="1287" y="478" font-size="22" font-weight="400" text-anchor="start" class="muted">结果 · 实际依据 · 访问证据</text>
    <path class="connector" d="M 600 516 L 600 595"/>
    <path class="connector" d="M 1135 516 L 1135 551"/>
    <path class="connector" d="M 78 516 L 78 1070 L 120 1070"/>
    <text x="63" y="911" font-size="22" font-weight="400" text-anchor="start" class="muted" transform="rotate(-90 63 911)">文件与 Dataset 可独立使用</text>
  </g>
  <g id="lane-labels">
    <text x="120" y="565" font-size="25" font-weight="500" text-anchor="start" class="muted">稳定核心：对象、内容与协作</text>
    <text x="950" y="539" font-size="25" font-weight="500" text-anchor="start" class="muted">扩展能力</text>
    <rect x="950" y="551" width="370" height="36" rx="7" fill="#FFFFFF" stroke="#CCBDDE" stroke-width="1.5"/>
    <text x="1135" y="577" font-size="21" font-weight="400" text-anchor="middle" class="muted">按来源 Repo scope 采用</text>
    <text x="1370" y="565" font-size="25" font-weight="500" text-anchor="start" class="muted">横向说明与可选流程</text>
  </g>
  <g id="object-core">
    <rect x="120" y="595" width="730" height="245" rx="12" fill="#EDF4FF" stroke="#BFD0E7" stroke-width="1.5"/>
    <text x="146" y="642" font-size="31" font-weight="600" text-anchor="start">Object｜对象组织与基本读写</text>
    <text x="146" y="676" font-size="23" font-weight="400" text-anchor="start" class="muted">object/ · 注册对象供给 · 固定身份与知识解释</text>
    <rect x="146" y="700" width="212" height="76" rx="8" fill="#FFFFFF" stroke="#CEDBED" stroke-width="1.5"/>
    <text x="160" y="729" font-size="24" font-weight="500" text-anchor="start">身份与表示</text>
    <text x="160" y="759" font-size="21" font-weight="400" text-anchor="start" class="muted">Object / Reference</text>
    <rect x="379" y="700" width="212" height="76" rx="8" fill="#FFFFFF" stroke="#CEDBED" stroke-width="1.5"/>
    <text x="393" y="729" font-size="24" font-weight="500" text-anchor="start">结构与说明</text>
    <text x="393" y="759" font-size="21" font-weight="400" text-anchor="start" class="muted">Schema / 元数据</text>
    <rect x="612" y="700" width="212" height="76" rx="8" fill="#FFFFFF" stroke="#CEDBED" stroke-width="1.5"/>
    <text x="626" y="729" font-size="24" font-weight="500" text-anchor="start">读写与来源</text>
    <text x="626" y="759" font-size="21" font-weight="400" text-anchor="start" class="muted">Reader / Writer</text>
    <text x="146" y="813" font-size="23" font-weight="400" text-anchor="start">发布经校验与条件提交；知识内容和版本由 Snapshot 保存。</text>
    <path class="connector" d="M 485 840 L 485 925"/>
    <text x="507" y="887" font-size="22" font-weight="400" text-anchor="start" class="muted">固定读取 / 单仓发布</text>
  </g>
  <g id="snapshot-core">
    <rect x="120" y="925" width="730" height="280" rx="12" fill="#F1F4F8" stroke="#C6D1DE" stroke-width="1.5"/>
    <text x="146" y="972" font-size="31" font-weight="600" text-anchor="start">Snapshot｜协作、版本与交付</text>
    <text x="146" y="1008" font-size="23" font-weight="400" text-anchor="start" class="muted">snapshot/ · Repository 是维护与权限边界</text>
    <rect x="146" y="1031" width="212" height="74" rx="8" fill="#FFFFFF" stroke="#D1DAE4" stroke-width="1.5"/>
    <text x="160" y="1059" font-size="23" font-weight="500" text-anchor="start">多团队独立供给</text>
    <text x="160" y="1089" font-size="21" font-weight="400" text-anchor="start" class="muted">各自维护来源仓</text>
    <rect x="379" y="1031" width="212" height="74" rx="8" fill="#FFFFFF" stroke="#D1DAE4" stroke-width="1.5"/>
    <text x="393" y="1059" font-size="23" font-weight="500" text-anchor="start">不可变发布版本</text>
    <text x="393" y="1089" font-size="21" font-weight="400" text-anchor="start" class="muted">历史引用可复核</text>
    <rect x="612" y="1031" width="212" height="74" rx="8" fill="#FFFFFF" stroke="#D1DAE4" stroke-width="1.5"/>
    <text x="626" y="1059" font-size="23" font-weight="500" text-anchor="start">当前权限边界</text>
    <text x="626" y="1089" font-size="21" font-weight="400" text-anchor="start" class="muted">仓与 Dataset 范围</text>
    <text x="146" y="1141" font-size="23" font-weight="400" text-anchor="start">Dataset：组合固定文件与版本，不扩大来源授权</text>
    <text x="146" y="1174" font-size="22" font-weight="400" text-anchor="start">Store：单仓 CAS · 条件推进   /   lakeFS 底座</text>
  </g>
  <g id="declarative-index-plugin">
    <rect x="950" y="595" width="370" height="185" rx="12" fill="#F5F0FB" stroke="#CCBDDE" stroke-width="1.5"/>
    <text x="975" y="635" font-size="29" font-weight="600" text-anchor="start">声明式索引</text>
    <text x="975" y="665" font-size="18" font-weight="400" text-anchor="start" class="code">discovery / declarativeindex</text>
    <text x="975" y="698" font-size="24" font-weight="400" text-anchor="start">候选查询 · 派生维护</text>
    <path class="connector" d="M 1135 706 L 1135 727"/>
    <rect x="975" y="735" width="320" height="31" rx="6" fill="#FFFFFF" stroke="#D7CCE4" stroke-width="1.5"/>
    <text x="1135" y="757" font-size="21" font-weight="400" text-anchor="middle">OpenSearch｜可重建投影</text>
    <path class="connector" d="M 950 690 L 850 690"/>
    <text x="900" y="642" font-size="21" font-weight="400" text-anchor="middle" class="muted">同依据</text>
    <text x="900" y="669" font-size="21" font-weight="400" text-anchor="middle" class="muted">回读正文</text>
  </g>
  <g id="liveaccess-plugin">
    <rect x="950" y="820" width="370" height="185" rx="12" fill="#F5F0FB" stroke="#CCBDDE" stroke-width="1.5"/>
    <text x="975" y="860" font-size="29" font-weight="600" text-anchor="start">LiveAccess</text>
    <text x="975" y="890" font-size="20" font-weight="400" text-anchor="start" class="code">liveaccess/</text>
    <text x="975" y="923" font-size="23" font-weight="400" text-anchor="start">透明取值 · 观察与访问证据</text>
    <path class="connector" d="M 1135 931 L 1135 952"/>
    <rect x="975" y="960" width="320" height="31" rx="6" fill="#FFF8ED" stroke="#DBC8A8" stroke-width="1.5"/>
    <text x="1135" y="982" font-size="21" font-weight="400" text-anchor="middle">外部资源｜保留源方授权</text>
  </g>
  <g id="future-plugins">
    <rect x="950" y="1045" width="370" height="160" rx="12" fill="#FCFAFF" stroke="#BCAACE" stroke-width="1.5" stroke-dasharray="8 6"/>
    <text x="975" y="1085" font-size="26" font-weight="500" text-anchor="start">后续能力（设计扩展）</text>
    <text x="975" y="1125" font-size="26" font-weight="400" text-anchor="start">Wield 等</text>
    <text x="975" y="1162" font-size="23" font-weight="400" text-anchor="start" class="muted">按所属合同接入对象使用</text>
    <text x="975" y="1189" font-size="20" font-weight="400" text-anchor="start" class="muted">不是已交付的通用执行器</text>
  </g>
  <g id="affordance">
    <rect x="1370" y="595" width="310" height="410" rx="12" fill="#F0F8F3" stroke="#BED6C5" stroke-width="1.5"/>
    <text x="1395" y="637" font-size="29" font-weight="600" text-anchor="start">Affordance</text>
    <text x="1395" y="677" font-size="24" font-weight="500" text-anchor="start">对象与系统的能力说明</text>
    <text x="1395" y="720" font-size="23" font-weight="400" text-anchor="start">用途 · 条件 · 输入</text>
    <text x="1395" y="755" font-size="23" font-weight="400" text-anchor="start">效果 · 成本 · 风险</text>
    <text x="1395" y="790" font-size="23" font-weight="400" text-anchor="start">合同引用 · 使用示例</text>
    <rect x="1395" y="817" width="260" height="157" rx="8" fill="#FFFFFF" stroke="#D1E2D7" stroke-width="1.5"/>
    <text x="1411" y="850" font-size="24" font-weight="500" text-anchor="start">分别核对</text>
    <text x="1411" y="883" font-size="21" font-weight="400" text-anchor="start">声明 · 装配 · 当前就绪</text>
    <text x="1411" y="916" font-size="21" font-weight="400" text-anchor="start">本次权限 · 实际结果</text>
    <text x="1411" y="954" font-size="21" font-weight="400" text-anchor="start" class="muted">说明读取不运行能力</text>
  </g>
  <g id="optional-application-flow">
    <rect x="1370" y="1045" width="310" height="160" rx="12" fill="#FAFBFC" stroke="#D3DCE6" stroke-width="1.5"/>
    <text x="1395" y="1085" font-size="25" font-weight="500" text-anchor="start">可选应用流程</text>
    <text x="1395" y="1120" font-size="22" font-weight="400" text-anchor="start" class="code">controlplane</text>
    <text x="1395" y="1158" font-size="23" font-weight="400" text-anchor="start">提案 · 预览 · 证据核对</text>
    <text x="1395" y="1188" font-size="21" font-weight="400" text-anchor="start" class="muted">按需采用，仍经 Writer 发布</text>
  </g>
  <g id="legend-and-boundaries">
    <text x="50" y="1258" font-size="24" font-weight="400" text-anchor="start">索引用于候选定位；知识正文按同一依据回读。动态观察与 Snapshot 版本分别留证。</text>
    <path d="M 50 1304 L 92 1304" stroke="#62748A" stroke-width="2.3"/>
    <text x="108" y="1313" font-size="22" font-weight="400" text-anchor="start" class="muted">已选职责与协作</text>
    <path d="M 330 1304 L 372 1304" stroke="#8971AA" stroke-width="2.3" stroke-dasharray="8 6"/>
    <text x="388" y="1313" font-size="22" font-weight="400" text-anchor="start" class="muted">后续扩展</text>
    <text x="1680" y="1313" font-size="22" font-weight="400" text-anchor="end" class="muted">逻辑协作图 · 不表示精确 import 或独立部署进程</text>
  </g>
</svg>
