# Official OpenAI Responses route for Agent acceptance. The credential is
# resolved by DSH's credentials service and then by OPENAI_API_KEY; no secret
# belongs in this file.
- id: loom-web-runtime
  disabled: true

- id: settings
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY

- id: agent-default-model
  config:
    provider: openai
    model: gpt-5.6-luna
    reasoningEffort: low
