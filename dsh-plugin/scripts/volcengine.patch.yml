# Volcengine Ark OpenAI Responses route for Agent acceptance. DSH resolves the
# ARK_API_KEY credential reference; this file contains no secret.
- id: loom-web-runtime
  disabled: true

- id: settings
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      volcengine:
        displayName: Volcengine Ark
        apiKeyEnv: ARK_API_KEY
        api: openai-responses
        baseURL: https://ark.cn-beijing.volces.com/api/v3
        models:
          - id: deepseek-v4-flash-ga-260731
            name: DeepSeek V4 Flash
            contextWindow: 256000
            maxTokens: 16384

- id: agent-default-model
  config:
    provider: volcengine
    model: deepseek-v4-flash-ga-260731
    reasoningEffort: low
