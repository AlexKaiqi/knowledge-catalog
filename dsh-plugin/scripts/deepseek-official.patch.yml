# Deterministic model route for the Knowledge Catalog MVP acceptance runs.
# The credential is resolved by DSH's credentials service and then by the
# DEEPSEEK_API_KEY process environment fallback; no secret belongs here.
- id: loom-web
  disabled: true

- id: settings
  disabled: true

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
    reasoningEffort: low

- id: llm-deepseek
  config:
    maxTokens: 8192
