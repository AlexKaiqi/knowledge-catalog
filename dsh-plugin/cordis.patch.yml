# The dsh-loom bundle patch. Applied over dsh-base by `dsh --profile <name>`
# after `dsh plugin --profile <name> add dsh-loom` (or `link:/abs/path/to/dsh-plugin`
# for local development).
#
# kcfs mounts each Workspace member into the host project before DSH starts.
# Keep dsh-base's stock fs-sandbox and tool-fs-search enabled: read/list/glob,
# ripgrep and shell must all observe the same Linux VFS as the user and IDE.
#
# Point this at your kc serve + Workspace in the profile's own cordis.patch.yml
# (later layers win per row). Defaults below are for:
#   kc serve --home /tmp/kc-demo
#   kc catalog workspace define --workspace notes ...

- insert:
    # Activate the package root so DSH discovers the paired browser bundle.
    # It deliberately does not replace ctx.fs.
    - id: loom-bundle
      name: dsh-loom
      config:
        home: !!js process.env.KC_HOME || ''
        bin: !!js process.env.KCFS_BIN || 'kcfs'
        catalog: !!js process.env.KC_CATALOG || ''
        workspace: !!js process.env.KC_WORKSPACE || ''
        principal: !!js process.env.KC_AS || ''
    # The Skill teaches grouped kc CLI usage. It contributes no model tool.
    - id: loom-knowledge-catalog-skill
      name: dsh-loom/skill
    # Human-facing, read-only VFS browser. Its host route keeps KC_AUTH_TOKEN
    # server-side; the browser never receives Catalog credentials.
    # Keep the runtime row distinct from the browser bundle's historical
    # loom-web identifier; some DSH patch stacks otherwise target/replace the
    # row instead of inserting the host route provider.
    - id: loom-web-runtime
      name: dsh-loom/web
      config:
        home: !!js process.env.KC_HOME || ''
