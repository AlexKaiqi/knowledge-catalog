name: kc-dsh-mvp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD:-gitea-compose-db}
    volumes:
      - gitea-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 2s
      timeout: 3s
      retries: 60

  gitea:
    image: gitea/gitea:1.26.0@sha256:af07b88edbb2173d20932f9c75ebcf4e61d7d5c2d6a7ab5cc6b97cba28aea352
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:-gitea-compose-db}
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:${GITEA_PORT:-13000}/
      GITEA__server__SSH_DOMAIN: localhost
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-12222}
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__security__INSTALL_LOCK: "true"
    ports:
      - "127.0.0.1:${GITEA_PORT:-13000}:3000"
      - "127.0.0.1:${GITEA_SSH_PORT:-12222}:22"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/healthz >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 90
      start_period: 10s

  gitea-init:
    image: gitea/gitea:1.26.0@sha256:af07b88edbb2173d20932f9c75ebcf4e61d7d5c2d6a7ab5cc6b97cba28aea352
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-kc-admin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-kc-compose-admin}
      GITEA_AGENT_USER: ${GITEA_AGENT_USER:-dsh-agent}
      GITEA_AGENT_PASSWORD: ${GITEA_AGENT_PASSWORD:-dsh-compose-agent}
    entrypoint: ["/bin/sh", "/scripts/gitea-init.sh"]
    volumes:
      - gitea-data:/data
      - kc-secrets:/run/kc-secrets
      - ./scripts:/scripts:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-19200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 80
      start_period: 20s

  kc:
    build:
      context: ../../../../..
      dockerfile: .scenes/data-warehouse/validation/runtime/dsh-stack/Dockerfile.kc
    depends_on:
      gitea-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    environment:
      KC_HOME: /var/lib/kc
      KC_GITEA_ORIGIN: http://gitea:3000
      KC_ELASTICSEARCH_URL: http://elasticsearch:9200
      KC_CATALOG: kr://acme/catalog
      KC_WORKSPACE: warehouse
    ports:
      - "127.0.0.1:${KC_PORT:-17380}:7380"
    volumes:
      - kc-home:/var/lib/kc
      - kc-secrets:/run/kc-secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7380/health"]
      interval: 2s
      timeout: 3s
      retries: 90
      start_period: 10s
    restart: unless-stopped

  dsh:
    build:
      context: ../../../../..
      dockerfile: .scenes/data-warehouse/validation/runtime/dsh-stack/Dockerfile.dsh
    depends_on:
      kc:
        condition: service_healthy
    environment:
      KC_SERVE: http://kc:7380
      KC_HOME: /var/lib/dsh/kc-client
      KC_CATALOG: kr://acme/catalog
      KC_WORKSPACE: warehouse
      DSH_HOME: /var/lib/dsh
      DSH_PERMISSION_MODE: ${DSH_PERMISSION_MODE:-workspace-write}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    ports:
      - "127.0.0.1:${DSH_PORT:-17400}:7400"
    volumes:
      - dsh-home:/var/lib/dsh
      - kc-secrets:/run/kc-secrets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7400/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 80
      start_period: 15s
    restart: unless-stopped

volumes:
  gitea-db:
  gitea-data:
  elasticsearch-data:
  kc-home:
  kc-secrets:
  dsh-home:
