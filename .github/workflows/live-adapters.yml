name: Live adapters

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: read

jobs:
  docker-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.6
          cache: true
      - run: python3 scripts/validation.py run --scope ci:live-adapters -- make test-docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-live-adapters
          path: .validation/runs/
          include-hidden-files: true
