- id: zk-so-environment
  title: 陌生 Agent 从公开入口理解文件版本与对象能力
  claims: ["object#U8", "object#U9", "affordance#U1"]
  given:
    - 独立 Snapshot/Object 世界已经初始化系统仓；没有业务对象、索引或外部取值服务。
    - Agent 只有 kc、服务地址和 zk-colleague 的登录身份；无源码、说明材料、答案或历史会话。
  when:
    - 人问这里有哪些核心概念、关系，以及保存、发布、交付、读取资料的能力、前提和用法。
  then:
    - 回答区分对象身份、Schema、方面、仓与不可变提交、Dataset 范围与消费权限，并引用公开环境依据。
    - 区分帮助说明的能力与本身份实际可执行的动作；不把未测试的插件能力说成已验证可用。
  risk: 概念和命令虽存在，陌生使用者仍拼不出正确的理解和使用路径。

- id: zk-so-supply-consume-revise
  title: 原始资料经陌生接入方交付后可由另一陌生消费者使用并复核修订
  claims: ["object#U1", "object#U2", "object#U7", "dataset#U1", "dataset#U2"]
  given:
    - 从 named-repositories-created 的两个空业务仓开始，接入方有明确的仓维护与 qinghe-shared 发布、授权权。
    - 接入方只有原始口径 v1、同事账号和交付物名称；消费者无本地业务材料、来源仓权限或聊天历史。
  when:
    - 接入方自主发布对象和交付；新会话消费者回答 GMV 算法、订单状态、周边界和负责人。
    - 接入方在新会话按原始口径 v2 修改原内容并发布新版；另一新会话消费者比较当前与初版。
  then:
    - 通过正式 Writer 发布符合所采用 Schema 的对象；不要求固定对象命名、文件布局或命令顺序。
    - 消费者沿获准交付读取，v1 排除 UNPAID 和 CANCELLED，v2 计入 UNPAID 而排除 CANCELLED。
    - 当前采用新规则；旧修订仍可回读旧规则，对象身份保持，依据固定提交可复核。
    - 独立状态检查确认发布、授权与版本结果；进程成功和模型自评不作为通过证据。
  risk: 资料能够保存却不能被同事理解使用，或修订覆盖原对象与已发布旧依据。
