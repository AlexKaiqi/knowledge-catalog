# Operator-only Snapshot/Object trial. No host ports or shared authority volumes.
name: ${KC_ZK_PROJECT:-kc-zk-snapshot}

services:
  postgres:
    image: ${KC_ZK_POSTGRES_IMAGE:-postgres:16.6-alpine}
    environment:
      POSTGRES_USER: lakefs
      POSTGRES_PASSWORD: ${KC_ZK_POSTGRES_PASSWORD:-zk-trial-postgres}
      POSTGRES_DB: lakefs
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lakefs -d lakefs"]
      interval: 2s
      timeout: 3s
      retries: 60

  minio-init:
    image: ${KC_ZK_BUSYBOX_IMAGE:-busybox:1.36}
    command: [mkdir, -p, /data/kc-authority]
    volumes:
      - minio-data:/data
    restart: "no"

  minio:
    image: ${KC_ZK_MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    command: [server, /data]
    environment:
      MINIO_ROOT_USER: ${KC_ZK_MINIO_USER:-zktrial}
      MINIO_ROOT_PASSWORD: ${KC_ZK_MINIO_PASSWORD:-zk-trial-minio}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes:
      - minio-data:/data

  lakefs:
    image: ${KC_ZK_LAKEFS_IMAGE:-treeverse/lakefs:1.86.0}
    environment:
      LAKEFS_DATABASE_TYPE: postgres
      LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING: postgres://lakefs:${KC_ZK_POSTGRES_PASSWORD:-zk-trial-postgres}@postgres:5432/lakefs?sslmode=disable
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000
      LAKEFS_BLOCKSTORE_S3_DISCOVER_BUCKET_REGION: "false"
      LAKEFS_BLOCKSTORE_S3_PRE_SIGNED_ENDPOINT: http://minio:9000
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: ${KC_ZK_MINIO_USER:-zktrial}
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: ${KC_ZK_MINIO_PASSWORD:-zk-trial-minio}
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ${KC_ZK_LAKEFS_ENCRYPT_KEY:-zk-trial-lakefs-encrypt-key}
      LAKEFS_STATS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8000/_health"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s

  bootstrap:
    image: ${KC_ZK_KC_IMAGE:-kc-zk-snapshot:local}
    entrypoint: [/bin/bash, /trial/snapshot-bootstrap.sh]
    environment: &kc-environment
      KC_ZK_ADMIN: ${KC_ZK_ADMIN:-admin}
      KC_ZK_REGISTRY_ID: ${KC_ZK_REGISTRY_ID:-kr://zk-trial/catalog}
      KC_ZK_LAKEFS_ACCESS_KEY: ${KC_ZK_LAKEFS_ACCESS_KEY:-ZKTRIALACCESSKEY}
      KC_ZK_LAKEFS_SECRET_KEY: ${KC_ZK_LAKEFS_SECRET_KEY:-zk-trial-lakefs-secret-key}
    depends_on:
      lakefs:
        condition: service_healthy
    volumes:
      - kc-data:/var/lib/kc
      - ./snapshot-bootstrap.sh:/trial/snapshot-bootstrap.sh:ro
    tmpfs:
      - /var/lib/kc/cache
    restart: "no"

  kc-server:
    image: ${KC_ZK_KC_IMAGE:-kc-zk-snapshot:local}
    entrypoint: [/bin/bash, -c]
    command:
      - 'export KC_LAKEFS_CREDENTIAL="$${KC_ZK_LAKEFS_ACCESS_KEY}:$${KC_ZK_LAKEFS_SECRET_KEY}"; exec kc serve --config /var/lib/kc/deployment.json --listen 0.0.0.0:7380'
    environment: *kc-environment
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - kc-data:/var/lib/kc
    tmpfs:
      - /var/lib/kc/cache
    networks:
      default:
        aliases: [kc-upstream]
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:7380/readyz"]
      interval: 2s
      timeout: 5s
      retries: 90

networks:
  default:
    name: ${KC_ZK_NETWORK:-kc-zk-snapshot_default}

volumes:
  postgres-data: {}
  minio-data: {}
  kc-data: {}
