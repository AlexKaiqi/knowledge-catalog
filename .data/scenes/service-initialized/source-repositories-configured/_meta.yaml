views:
  - "access-control"
layer: "2"
role: "operator"
surface: both
publishes:
  - "snapshot.authority"
  - "dataset.registry"
  - "writer.snapshot"
probes:
  - file: "probe-not-registered.feature"
    source: "dataset.registry"
    views:
      - "access-control"
    title: "未登记业务仓不能进入 Dataset "
  - file: "probe-write-without-register.feature"
    source: "writer.snapshot"
    views:
      - "access-control"
    title: "已配置未登记的源可由 Writer 维护并回读"
evidence:
  - id: "empty-object-authority-locator-metadata"
    source: "writer.snapshot"
    views: ["publication", "lifecycle"]
    title: "空对象来源及其独立克隆保留完整零 Schema referrers"
    tests:
      - "TestSceneExistingRepositoryHasCompleteEmptyObjectMetadata"
fixture: "两个既有空对象 Snapshot 由 Writer 显式 locator 维护交付完整空协议元数据，已配置但尚未进入登记空间。供未登记边界、接入与后续绑定访问复用。"
summary: "空对象仓与关系仓已配置；插件实例由部署采用，登记空间仍只登记 System Repository。"
