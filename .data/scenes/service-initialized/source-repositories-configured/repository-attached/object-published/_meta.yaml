views:
  - "publication"
layer: "2"
role: "provider"
surface: both
publishes:
  - "snapshot.product"
summary: "Canonical 已 COMMIT；不依赖某个 principal 的 writer 授权世界"
evidence:
  - source: "snapshot.product"
    views:
      - "publication"
      - "consumption"
    tests:
      - "TestCatalogRepoReadFlow"
      - "TestCatalogRepoReadErrors"
      - "TestAspectBindingResolveThroughCLIAndWorkspace"
      - "TestWorkspaceSearchDoesNotAdoptUnselectedSourceDeclarations"
      - "TestWorkspaceSearchUnsatisfiedExplainsHowToRecover"
      - "TestWorkspaceSearchPublicContinuation"
      - "TestObjectResolveAndObjectLogOverHTTP"
      - "TestCatalogViewsChecksAndObjectResolve"
    title: "读取与解析已发表对象返回对应正文及历史"
  - id: "relation-discovery-without-index-fails-closed"
    source: "snapshot.product"
    views: ["consumption", "lifecycle"]
    title: "Dataset 已发表并可精确回读，但无索引不能发现关系"
    tests:
      - "TestRelationsWithoutIndexNeverFallsBackToAuthorityScan"
  - source: "schema.access"
    views:
      - "publication"
      - "consumption"
    tests:
      - "TestDescribeSchemaListsStructureWithoutAccess"
    title: "描述 Schema 时仅返回结构"
  - source: "access.rules"
    views:
      - "access-control"
    tests:
      - "TestUserJourneyObjectGrantDoesNotAuthorizeAccess"
    title: "授予对象读取权后资源访问仍需独立授权"
probes:
  - file: "probe-repo-read.feature"
    source: "snapshot.product"
    views:
      - "publication"
      - "consumption"
    title: "读取已发表对象的正文和历史，固定 Dataset 修订回读并返回精确空关系结果"
  - file: "probe-read-basis-replay.feature"
    source: "snapshot.product"
    views:
      - "consumption"
    title: "读取取得固定依据后 HEAD 前进，回读仍按原候选坐标与原状态摘要，新请求采用新值"
  - file: "probe-compare-two-versions.feature"
    source: "snapshot.product"
    views:
      - "consumption"
    title: "两版对象按依据与固定 commit 双侧比较，保留双侧坐标与单条值变化，不与目录发布预览混用"
  - file: "probe-no-change-receipt.feature"
    source: "writer.snapshot"
    views:
      - "publication"
      - "lifecycle"
    title: "同值条件写返回无变化回执并保留原 commit，重放按原回执，同 id 换内容被拒"
  - file: "probe-zero-diff-directory.feature"
    source: "writer.snapshot"
    views:
      - "publication"
      - "lifecycle"
    title: "目录零差异发布不创建提交并复用原回执，改动后的意图不能借旧 id 提交"
  - file: "probe-history-continuation.feature"
    source: "snapshot.product"
    views:
      - "consumption"
      - "lifecycle"
    title: "历史首页给游标，HEAD 推进后仅用游标续页仍按原依据推进且拒绝混入坐标"
  - file: "probe-remove.feature"
    source: "writer.snapshot"
    views:
      - "publication"
      - "lifecycle"
    title: "删除临时对象后无法解析，原有对象仍可读取"
fixture: "object 仓主分支已提交 note/hello，正文 text 为 hi。"
