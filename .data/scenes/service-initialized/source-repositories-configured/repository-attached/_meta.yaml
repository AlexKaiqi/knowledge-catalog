      - claim: "object#U16"
        detail: "授权计划仅使用固定维护元数据，无正文预读；Native 无坐标、空坐标、多重归属、错误身份和模型冲突拒绝，不按路径深度发权。"
  - id: "object-reference-cli-http-maintenance"
    title: "同一 URN 经真实 CLI 与 HTTP 读改删并保留维护依据"
