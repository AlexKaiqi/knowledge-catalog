      - "TestReferenceReadDoesNotFollowHeadWhileLoadingSelectedBody"
      - "TestReferenceReadRejectsCoordinatesThatDisagreeWithUnit"
      - "TestReferenceSelectionRejectsLegacyLocatorBeforeReadingBodies"
    verifies:
