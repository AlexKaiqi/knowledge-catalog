layer: "1"
role: "provider"
surface: both
views:
  - "publication"
  - "access-control"
publishes:
  - "writer.snapshot"
  - "object.readme"
  - "access.rules"
  - "catalog.lifecycle"
  - "writer.merge"
  - "resource.handle"
  - "aspect.binding"
  - "binding.observation"
  - "projection.index"
summary: "服务只读打开预配置的既有 Snapshot 并原子提交 登记空间 成员登记"
evidence:
  - id: "liveaccess-plugin-selection-and-values"
    title: "按 Repo 选择真实实例，混合值逐位置采用"
    source: "resource.handle"
    views: ["consumption", "lifecycle"]
    tests:
      - "TestServerLiveAccessRepoSelectionMixedValuesAndDataset"
    verifies:
      - claim: "liveaccess#U14"
        detail: "真实 Writer、Repo metadata、SDK/Server 与来源 HTTP 验证两仓/组合、重启改选、固定声明不变及指定贡献缺失/不兼容不回退。"
      - claim: "liveaccess#U15"
        detail: "Repo/Dataset 同对象保留固定值、31、合法 null 与独立 Member；来源、Basis、Schema 三类错误只影响失败位置，失败无成功观察。"
  - id: "liveaccess-current-caller-and-credential-boundaries"
    title: "当前认证自动传递，目标与重定向不扩权"
    source: "resource.handle"
    views: ["access-control", "consumption"]
    tests:
      - "TestServerLiveAccessInterleavedAuthenticationUsesVerifiedCurrentCaller"
      - "TestServerLiveAccessCredentialBoundariesPreserveSiblingsAndSafeEvidence"
      - "TestHTTPPolicyCustomRedirectCannotRewriteValidatedOrigin"
      - "TestHTTPPolicySameOriginRedirectKeepsCurrentProofAfterClientCallback"
    verifies:
      - claim: "liveaccess#U16"
        detail: "真实认证 READ 交错 alice/bob，主体/证明/request/trace 各自对应；初始及变化目标、307、源值/依据/转义错误反射均验证局部失败、无越界源调用且对象/请求正文/日志/审计无证明。"
  - id: "liveaccess-original-read-audit"
    title: "更新和重启后经独立权限复核当次结果"
    source: "binding.observation"
    views: ["consumption", "access-control", "lifecycle"]
    tests:
      - "TestServerLiveAccessAuditRestoresOriginalReadAndRechecksSeparatePermission"
    verifies:
      - claim: "liveaccess#U17"
        detail: "真实 READ 留下31/null/失败、固定坐标和原依据；源与Snapshot推进、进程替换、源离线后审计还原r1且零来源尝试。普通结果不附证据，读权/审计权及撤权独立生效，旧Snapshot按固定commit复核。"
  - id: "liveaccess-reliable-original-result-evidence"
    title: "实际介质留证失败、丢失与到期分别可辨"
    source: "binding.observation"
    views: ["consumption", "lifecycle"]
    tests:
      - "TestServerLiveAccessPersistenceFailuresPreventSuccessfulDelivery"
      - "TestServerLiveAccessAuditDistinguishesCorruptionLossAndExpiry"
      - "TestRetainedValueFailureAndBasisLossFailWithinRetention"
      - "TestCorruptPayloadCannotEndRetentionEarly"
    verifies:
      - claim: "liveaccess#U18"
        detail: "真实过程账或payload写入失败阻止交付；保留期内实际值/失败/原依据丢失及摘要损坏不伪成功；合法历史承诺正常到期区别于丢失，审计不重取当前来源补证。"
  - id: "liveaccess-module-owned-implementation-and-cli"
    title: "实现、CLI 和依赖方向归所属模块"
    source: "resource.handle"
    views: ["lifecycle"]
    tests:
      - "TestLiveAccessConcreteImplementationsStayInModule"
      - "TestLiveAccessRuntimeDependencyBoundaries"
      - "TestLiveAccessCLILeafResponsibilitiesStayWithModule"
      - "TestLiveAccessOwnershipGuardRejectsCopiedImplementationsAndShims"
      - "TestLiveAccessCLIHostOwnershipGuardRejectsScatteredLeaves"
    verifies:
      - claim: "liveaccess#U13"
        detail: "实际AST/依赖图验证专属实现及CLI定义、参数、帮助、输出在liveaccess目录，宿主只装配；毒化复制、shim和间接反向依赖反例钉守卫，不能用路径存在代替。"
  - id: "liveaccess-product-plugin-help"
    title: "公开插件帮助同源且无业务取值"
    source: "resource.handle"
    views: ["consumption"]
    tests:
      - "TestServerLiveAccessHelpUsesProductCLIWithoutHomeRuntime"
    verifies:
      - claim: "liveaccess#U19"
        detail: "真实 cli.Run→SDK→Server 返回LiveAccess模块协议、用法及承诺，未知名称明确失败；仅授权文件无Home/runtime仍可读说明，业务构造/取值计数为零。"
  - id: "liveaccess-member-index-original-observation"
    title: "所选 Member 的真实值可检索，命中正文沿原观察"
    source: "projection.index"
    views: ["consumption", "publication"]
    tests:
      - "TestSelectedLiveAccessMemberProjectionRetainsOriginalObservation"
      - "TestFailedLiveAccessMemberCannotPublishStateProjection"
    verifies:
      - claim: "liveaccess#U20"
        detail: "真实Writer、所选LiveAccess/索引Entry和OpenSearch以Schema/access建立Member观察31/g1；来源变47后固定StateRevision查询及命中正文仍31/原Schema/原来源。首次来源/Basis/Schema/未采用失败无成功projection，不索引7占位或失败说明，不伪完整零命中。"
  - id: "published-image-discovery"
    source: "writer.snapshot"
    views:
      - "publication"
      - "consumption"
      - "lifecycle"
    tests:
      - "TestPublishedImageDiscoveryKeepsBusinessIdentity"
    title: "图片说明按业务身份发现，路径迁移不改变固定读回"
    verifies:
      - claim: "object#U1"
        detail: "图片说明、普通能力成员与字段 access Schema 经公开 Writer 同批发布；Schema 与发现/读回都核对回执 commit，没有安装图片处理器。"
      - claim: "object#U2"
        detail: "显式迁移图片 definition 的物理路径后业务 ObjectID、完整对象值及兄弟 interfaces 成员保持，旧 commit 仍读回原值。"
      - claim: "object#U10"
        detail: "实际图片路径迁移前后按同一来源 ObjectID 读回完整值和兄弟成员，旧 commit 仍原值；不证明新 URN 解析或跨仓同名输入。"
  - id: "published-dispersed-module-discovery"
    source: "writer.snapshot"
    views:
      - "publication"
      - "consumption"
    tests:
      - "TestPublishedModuleDiscoveryKeepsDispersedResourceReferences"
    title: "分散模块声明可被发现，资源集合不自动扩大仓权限"
    verifies:
      - claim: "object#U1"
        detail: "模块说明经公开 Writer/Server 发布及按字段 access 发现；源码、向量及另一仓许可证的实际 commit/path 原样保留，另一仓 HEAD 不动且消费方仍不能读取其私有对象。"
  - id: "published-external-table-discovery"
    source: "writer.snapshot"
    views:
      - "publication"
      - "consumption"
    tests:
      - "TestPublishedExternalTableDiscoveryDoesNotContactOfflineSource"
      - "TestObjectPublicationDoesNotRequireIndexOrInstalledHandler"
    title: "外部表离线与未安装能力不成为对象发布门槛"
    verifies:
      - claim: "object#U1"
        detail: "来源返回不可用、处理器未安装时外部表说明及能力声明仍可发布与固定读回，字段 access 支持发现且来源请求计数为零；无索引则显式缺查询能力，不扫描兜底。"
      - claim: "object#U19"
        detail: "无索引或未装配处理器、外部源离线时，声明仍经 Writer 发布并固定读回，源请求计数为零；新统一引用由独立 CLI／服务证据承担。"
  - source: "writer.snapshot"
    views:
      - "publication"
    tests:
      - "cli/write_flow_test.go"
    title: "通过 Writer 写入后按写入合同返回结果"
  - source: "writer.snapshot"
    views:
      - "publication"
    tests:
      - "TestAspectModificationKeepsSiblingAndIdentity"
    title: "切面级修改保持兄弟切面原值与对象身份"
    verifies:
      - claim: "object#U2"
        detail: "同一对象的 definition 切面改为 v2 后 runtime 切面保持原值；两个切面读取都落在同一 object_id 并各自命名切面（消费方可按切面选择）。"
      - claim: "object#U13"
        detail: "现有完整 Aspect 更新保持兄弟 Aspect 与身份；Member 替换／删除和根全部删除由另一个具名回归分别验证。"
  - source: "writer.snapshot"
    views:
      - "publication"
    tests:
      - "TestLostResponseRecoversFromReceiptAndRefusesContentSwap"
    title: "同一命令身份拒绝换内容，回执暴露已接受事实"
    verifies:
      - claim: "object#U5"
        detail: "相同命令身份相同内容重放得到 REPLAYED；同身份另一份内容以 IDEMPOTENCY_CONFLICT 拒绝且 HEAD 不动；writer receipt 按 command-id 暴露 status/digest/commit 回执，响应丢失时无需重写。"
  - source: "writer.snapshot"
    views:
      - "publication"
    tests:
      - "TestCrossRepositoryRelationPublishKeepsEndpointRepoUntouched"
    title: "跨仓关系发布不写端点仓、不扩大读权、保留端点坐标"
    verifies:
      - claim: "object#U6"
        detail: "在 core 发布 owned-by 关系、owner 端点指向 other 仓 Team:finance：other 的 HEAD 与授权规则不变；关系对象经精确读取保留两端点坐标与存储来源（无索引时精确读仍成立）。"
  - source: "snapshot.authority"
    views:
      - "access-control"
    tests:
      - "TestLocalStoreConfig"
      - "TestScaleProfileRepoAddLakeFS"
      - "TestRepositoryConnectionCLIRecoversExpiredCredentialsWithoutRebinding"
    title: "按仓配置连接 authority，凭证恢复后保持原绑定"
  - source: "outbound.hook"
    views:
      - "publication"
    tests:
      - "TestPrePutDeniedLeavesNoCommit"
      - "TestPostPutPointersOnly"
    title: "写前 Hook 拒绝不产生提交，写后 Hook 仅携带指针"
  - source: "object.readme"
    views:
      - "publication"
      - "consumption"
    tests:
      - "TestCatalogShowRepositoriesStayIdentityAndReadmeIsObject"
    verifies:
      - claim: "service#U5"
        detail: "登记空间 库存列出 System 与业务仓身份及 Dataset，README 作为对象写入并由 READ 回读，库存不含 README 正文或描述字段。"
    title: "列举库存只返回身份，README 通过对象读取返回正文"
  - id: "inventory-without-body"
    title: "授予库存读权后可发现成员，正文仍需独立读权"
    views:
      - "access-control"
    source: "access.rules"
    tests:
      - "TestCatalogReadDiscoversWithoutObjectRead"
      - "TestCatalogInventoryDoesNotHideReposWithoutObjectRead"
  - id: "declared-repository-read-boundary"
    title: "读取已声明仓默认放行，未声明仓仍需授权"
    views:
      - "access-control"
    source: "access.rules"
    tests:
      - "TestUndeclaredSystemRepositoryStillRequiresGrant"
      - "TestAuthenticatedPrincipalReadsDeclaredRepositoryWithoutGrant"
  - id: "system-authenticated-read-and-writer-denial"
    title: "正式部署读取 System Schema 成功，Writer 写入被拒绝"
    views:
      - "access-control"
    source: "access.rules"
    tests:
      - "TestDeclaredSystemRepositoryUsesAuthenticatedDefault"
      - "TestRuntimeWriterRefusesSystemRepository"
    verifies:
      - claim: "object#U1"
        detail: "正式配置初始化后，已认证 viewer 经 Server 可浏览 System Schema，但 Writer PUT 返回 FORBIDDEN；运行时 Writer 也拒绝 System 仓。"
  - source: "access.rules"
    views:
      - "access-control"
    tests:
      - "cli/write_flow_test.go"
      - "TestDesiredDirCommitRequiresWriterCommit"
      - "TestAuditTrail"
    title: "提交所需写权独立检查且操作进入审计轨迹"
  - source: "catalog.lifecycle"
    views:
      - "lifecycle"
    tests:
      - "TestRegisterRetireArchive"
      - "TestCatalogArchiveRejectsAnUnknownExplicitTarget"
    title: "归档已知 登记空间 成功，显式未知目标被拒绝"
  - source: "aspect.binding"
    views:
      - "publication"
    tests:
      - "TestResolveBindingFromSchemaWithoutInstance"
      - "TestResolveBindingReadsSchemaOrigin"
    id: "binding-resolves-schema-origin"
    title: "Binding 从 Schema 解析 origin 与未实例化地址"
  - source: "resource.handle"
    views:
      - "publication"
      - "consumption"
    tests:
      - "TestResolveDescriptorBindingAtPinnedCommit"
      - "TestCatalogViewsChecksAndObjectResolve"
    id: "descriptor-resolves-fixed-version"
    title: "资源描述符按固定版本解析并检查对象视图"
  - source: "binding.observation"
    views:
      - "publication"
      - "lifecycle"
    tests:
      - "TestChangeNoticeRejectsBody"
      - "TestProjectionNotifyHTTPRejectsObservationBody"
      - "TestProjectionControllerNoticePullsStateWithoutChangingSnapshot"
      - "TestStateRefreshFindsDynamicValueWithoutChangingSnapshot"
      - "TestProjectionCompilerRequiresObservationForBindingEligibility"
      - "TestObservedNullProvesMissingAndFailedRefreshKeepsPublishedRevision"
    id: "notice-validates-and-refreshes-observation"
    title: "State notice 拒绝正文并按固定 Binding 刷新观察"
    verifies:
      - claim: "liveaccess#U2"
        detail: "成功观察 null 可支持 MISSING；后续 runtime 失败使 refresh 失败并保留原已发布 revision，不证明旧结果仍满足时效要求。"
      - claim: "liveaccess#U3"
        detail: "通知正文被拒绝；显式 notice 后重新取值并更新动态检索，Snapshot 保持不变，不证明丢通知或重启后的恢复。"
  - source: "projection.index"
    views:
      - "publication"
      - "lifecycle"
    tests:
      - "TestProjectionControllerNoticePullsStateWithoutChangingSnapshot"
      - "TestStateRefreshObjectsOnlyTouchesNamedAddress"
      - "TestDynamicProjectionPublicEnvelopesStayCompact"
      - "TestProjectionNotifyPullsBoundStateWithoutChangingHEAD"
      - "TestSceneAccessorNoticeUpdatesSearchIndex"
    id: "state-refresh-preserves-snapshot-head"
    title: "动态观察更新索引且不移动 Snapshot HEAD"
    verifies:
      - claim: "liveaccess#U8"
        detail: "单对象刷新只增加一次 lookup，并能检索到新值；未断言观察复制、摘要计算和物理索引写入成本。"
  - id: "state-read-distinguishes-value-and-failure"
    title: "状态读取保留双依据，缺 runtime 或无效观察不能返回业务值"
    source: "binding.observation"
    views:
      - "consumption"
    tests:
      - "TestStateBindingHydratesConsumerReadAndKeepsBothBases"
      - "TestBoundReadFailsClosedWithoutStateRuntime"
      - "TestStateRuntimeFailuresAndInvalidBasisFailHonestly"
      - "TestWorkspaceReadHydratesStateBindingThroughTypedObjectAPI"
      - "TestBusinessNullContrastsPlaceholderAndNeverFallsBackToScan"
      - "TestDirectResourceAccessValidatesPinnedObservation"
    verifies:
      - claim: "liveaccess#U2"
        detail: "成功读取保留声明 commit/digest 与 observation basis；缺 runtime、连接失败和不完整 basis 分别被拒绝，不返回占位空值。"
      - claim: "liveaccess#U15"
        detail: "公共 Dataset READ 实际取值，成功外部值与固定值保留；合法 null 有依据，单地址来源错误、非法依据或违反固定 Schema 不冒充业务空值。尚未验证同对象混合多个成功与失败的公共结果。"
  - id: "state-observation-checks-published-declaration"
    title: "动态观察只能使用 Dataset 发布范围内的同版本声明"
    source: "binding.observation"
    views:
      - "consumption"
    tests:
      - "TestDatasetStatePlanningUsesPublishedSchemaScope"
      - "TestDatasetStateObservationRequiresPublishedDeclaration"
    verifies:
      - claim: "liveaccess#U5"
        detail: "动态规划只使用发布范围内的 Schema；观察对应声明未发布或 commit 不同则拒绝，不证明旧声明持续维护或 runtime 退役处理。"
  - id: "state-runtime-transports-caller-identity"
    title: "资源访问携带调用方身份且凭证不进入请求正文"
    source: "resource.handle"
    views:
      - "access-control"
    tests:
      - "TestHTTPStateLookupForwardsCallerAuthentication"
      - "TestHTTPStateLookupRequiresCallerPrincipal"
      - "TestTypedObjectReadForwardsTaihuCallerAuthentication"
    verifies:
      - claim: "liveaccess#U7"
        detail: "认证证明在请求头中传递、主体随调用保留，证明不进入请求正文；缺主体时拒绝调用，不证明目标信任、audience 或后台身份隔离。"
      - claim: "liveaccess#U16"
        detail: "公共对象 READ 的调用方证明经 Server 到达来源，返回实际数据；证明不进资源请求正文，未证明不适用目标或重定向的政策。"
  - id: "liveaccess-module-ownership"
    title: "LiveAccess 实现与公开依赖保持独立归属"
    source: "resource.handle"
    views:
      - "lifecycle"
    tests:
      - "TestObjectCapabilityModulesOwnTheirImplementations"
      - "TestObjectCapabilityPublicDepth"
      - "TestObjectRootsDoNotImportTheirDependentImplementations"
    verifies:
      - claim: "liveaccess#U13"
        detail: "结构守卫检查 LiveAccess 实现目录、公开依赖深度及对象基础包不反向依赖实现；不宣称运行接入。"
      - claim: "object#U20"
        detail: "真实 Object 相关模块与 imports 检查实现目录、公开入口深度及根包依赖方向；不以该结构结果证明业务或唯一声明解释已经迁移。"
  - id: "liveaccess-existing-handler-integration"
    title: "既有 LiveAccess 处理器真实访问来源并采用结果"
    source: "resource.handle"
    views:
      - "consumption"
    tests:
      - "TestPublicInvokeLiveAccessUsesPublishedContract"
      - "TestLiveAccessUsesPinnedTargetAndSeparatesObservation"
    verifies:
      - claim: "liveaccess#U14"
        detail: "既有公开处理器调用实际来源并采用返回值与观察依据；不证明新插件入口、A/B 目标选用或替换。"
  - id: "liveaccess-access-evidence"
    title: "直接访问保留真实目标、请求关联及无凭证的成功失败证据"
    source: "resource.handle"
    views:
      - "access-control"
      - "consumption"
    tests:
      - "TestDirectResourceAccessRecordsActualAccessEvidence"
      - "TestObjectReadFailsClosedWhenAccessEvidenceCannotPersist"
      - "TestAccessReceiptIsGeneratedOnlyAfterDurableAppend"
      - "TestLatestOnlyRecordLossAndExpiryFailDistinguishably"
    verifies:
      - claim: "liveaccess#U16"
        detail: "直接访问的本次认证证明到达 HTTP 来源，成功及来源失败的访问/审计记录不含证明。"
      - claim: "liveaccess#U17"
        detail: "访问证据关联本次主体、请求、固定目标和原观察依据；没有实际原值/逐值失败及按请求历史回读的完整旅程。"
      - claim: "liveaccess#U18"
        detail: "必需留证失败不成功，耐久回执可点查；保留端口返回完整原值/依据，丢失与到期错误可区分，未证明真实保留介质。"
  - id: "ordinary-state-read-rejects-stream"
    title: "普通读取遇到 Stream 时明确缺能力且不调用 State runtime"
    source: "aspect.binding"
    views:
      - "consumption"
    tests:
      - "TestOrdinaryReadRejectsStreamBinding"
    verifies:
      - claim: "liveaccess#U9"
        detail: "普通 READ 拒绝 Stream Binding 且不调用 State lookup；未覆盖未来窗口、断档恢复或订阅。"
  - source: "access.rules"
    views:
      - "access-control"
    tests:
      - "TestResolveDescriptorBindingAtPinnedCommit"
      - "TestCatalogViewsChecksAndObjectResolve"
    id: "resource-resolution-preserves-authorization"
    title: "描述符解析与对象视图检查保持资源边界"
  - id: "object-model-and-owned-cli"
    title: "根帮助本地说明对象模型且模块输出保持所属合同"
    source: "object.readme"
    views:
      - "consumption"
    tests:
      - "TestHelp"
      - "TestLocalModelAndLeafHelpNeedNoClient"
      - "TestBasicObjectHelpShowsOnlyReferenceAddress"
      - "TestEveryPublicHelpExplainsUseEffectsAndRecoveryWithoutExecuting"
      - "TestReferenceReadKeepsItsMaintenanceAndSourceEvidence"
      - "TestResolveKeepsItsOwnProductShape"
      - "TestSchemaDescribeKeepsReportShapeSeparateFromRead"
      - "TestCLIEvaluationDailyJourneyProductStdout"
      - "TestUsageInvalidShowsReasonAndLeafUsage"
      - "TestRemoteTypedDispatchRoutesSupportedOperations"
    verifies:
      - claim: "object#U9"
        detail: "无认证客户端时根帮助含概念、联系、能力及例子，叶帮助说明输入／恢复且无业务执行；保留根帮助禁止完整参数表的断言。指定参数旅程不证明独立使用者自主选择。"
      - claim: "object#U20"
        detail: "Object 模块维护单一对象引用的帮助与产品输出；READ 保留维护依据和逐单元来源，resolve 保留自身任务的产品形状，Schema report 不混入 READ 证据字段。正式 typed 分派用每叶合法参数验证 DTO／路由，生产未知参数拒绝规则不放宽。"
  - id: "object-urn-reference-identity"
