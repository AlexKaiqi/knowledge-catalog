      - "access-control"
    tests:
      - "TestObjectReferenceKeepsIdentitySeparateFromPointer"
      - "TestReferenceURNPrefixIsCaseInsensitiveWithoutChangingIdentity"
      - "TestReferenceCoordinatesAreBoundBeforeAuthorization"
      - "TestReferenceFragmentTravelsAsJSONAndNullIsExplicit"
    verifies:
      - claim: "object#U10"
        detail: "完整 Repo／ObjectID 的保留字符、百分号、中文独立编码往返，URN 前缀大小写不改变身份；身份与 Pointer 冲突明确拒绝，授权前归一化来源坐标。fragment 作为 JSON 请求数据送达，null 不丢失。"
  - id: "object-fixed-and-bounded-read"
    title: "固定对象与 Pointer 选择提前限制维护单元读取"
