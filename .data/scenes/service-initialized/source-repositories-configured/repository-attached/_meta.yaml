        detail: "根、Aspect、Member、deep 的确值与响应不含兄弟正文；转义／空键／null／数组非法位置独立 Oracle；正文加载中 HEAD 推进不改变固定依据，无关单元毒化且无 scan。旧索引缺坐标在读正文前报缺能力，不全扫猜测。"
      - claim: "object#U12"
