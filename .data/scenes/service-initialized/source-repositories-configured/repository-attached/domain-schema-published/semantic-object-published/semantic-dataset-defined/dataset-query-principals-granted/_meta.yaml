views:
  - "access-control"
  - "consumption"
layer: "app"
role: "operator"
surface: both
source: "access.rules"
also_freezes:
  - "projection.index"
  - "identity.bind"
evidence:
  - source: "projection.index"
    views:
      - "publication"
      - "consumption"
    tests:
      - "TestHistoricalDatasetReadStaysOnPublishedCommit"
      - "TestDatasetSearchKeepsReleaseWhenPublicationAdvancesBeforeObjectRead"
    id: "historical-dataset-search-requires-real-projection"
    title: "历史 Dataset 读取保持发布 commit，查询与回读在并发发布中不切换版本"
probes:
  - file: "dataset-search-follows-published-revision.feature"
    source: "projection.index"
    views:
      - "publication"
      - "consumption"
    title: "Dataset 重新发布后搜索与回读使用服务版本"
  - file: "dataset-cli-discovers-searches-reads.feature"
    source: "access.rules"
    views:
      - "access-control"
      - "consumption"
    verifies:
      - claim: "service#U5"
        detail: "同一显式主体经 Server 发现 登记空间 与 scene-set，浏览仓 Schema 后 SEARCH 命中指标，再 READ 指标值及非空 commit、关系值与所属仓，并定位关系。"
    title: "同一主体经 Server 发现并检索回读 Dataset 对象"
  - file: "traverse-closure-follows-relations.feature"
    source: "object.traverse"
    views:
      - "consumption"
    title: "有界邻域闭包：Dataset 范围内沿关系到达邻居对象，边与跳深显式"
  - file: "dataset-grants-do-not-transfer-principals.feature"
    source: "access.rules"
    views:
      - "access-control"
      - "consumption"
    title: "Dataset 授权按人隔离且不扩成仓级读权"
  - file: "dataset-consumer-fixes-revision.feature"
    source: "projection.index"
    views:
      - "consumption"
    title: "消费者沿同一 Dataset 修订发现可检索字段、检索并回读"
fixture: "Dataset 修订的选入范围投影已准备；alice、copilot 与未获权 etl 的 Dataset 与仓权限已分别确定。"
