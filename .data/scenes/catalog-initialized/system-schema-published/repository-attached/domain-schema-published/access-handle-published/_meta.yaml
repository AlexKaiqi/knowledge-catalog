layer: "2"
role: provider
surface: both
publishes:
  - aspect.binding
  - resource.handle
summary: Bound State 的 origin 在 Domain Schema frontmatter；实体只要有身份。接入方容器（Resource Access / Collector / Observer）在 _materials/accessor。ResourceDescriptor 给 invoke。
evidence:
  - source: aspect.binding
    tests:
      - TestResolveBindingFromSchemaWithoutInstance
      - TestResolveBindingReadsSchemaOrigin
  - source: resource.handle
    tests:
      - TestResolveDescriptorBindingAtPinnedCommit
      - TestCatalogViewsChecksAndKnowledgeResolve
probes:
  - file: probe-access-without-runtime.feature
    source: resource.handle
  - file: probe-access-operation.feature
    source: resource.handle
  - file: probe-access-rejects-operation.feature
    source: resource.handle
