views:
  - "consumption"
layer: "1"
role: "project"
surface: both
publishes:
  - "dataset.compose"
summary: "命名知识集 scene-notes 已将主分支 selector 冻结到具体提交（canonical 脊的 Dataset 前态；语义脊的对应前态是 knowledge-set-defined）"
evidence:
  - source: "dataset.compose"
    views:
      - "consumption"
    tests:
      - "TestOpenedKnowledgeSetPinDoesNotMoveWithLaterCommit"
      - "TestRemoteAccessDescribeSendsWorkspaceNotRepository"
      - "TestPlanAccessTwoRepositories"
    title: "固定知识集版本后后续写入不改变 pin，访问计划保留各仓来源"
  - source: "dataset.compose"
    views:
      - "consumption"
      - "access-control"
    tests:
      - "TestDatasetDirectoryDeliveryReorganizesMultipleRepositories"
    title: "仅凭 Dataset 读权枚举、读取两仓三个重组目录，同名文件保留来源，原路径与前缀上跳读取拒绝"
    verifies:
      - claim: "dataset#U9"
        detail: "经 Server 以 Dataset 读权发布两仓三个重组子目录，按新目录位置枚举并读取，同名文件保留各自来源与固定 commit；未选中的上游目录不出现在列表，原路径与前缀上跳读取被拒绝。"
  - source: "dataset.compose"
    views:
      - "consumption"
      - "access-control"
    tests:
      - "TestDatasetDirectoryDeliveryRejectsTraversalInsideRelativePaths"
    title: "路径中部上跳不能越过所选子树读取或枚举（回归已执行通过）"
    verifies:
      - claim: "dataset#U6"
        detail: "清理后的交付相对路径仍必须落在所选子树内，路径中部父目录片段把请求带出子树时文件读取与目录枚举都拒绝。"
  - source: "dataset.compose"
    views:
      - "consumption"
      - "lifecycle"
    tests:
      - "TestDatasetDirectoryDeliveryRepublishKeepsOldLayoutAndBytes"
      - "TestDatasetDirectoryDeliveryRejectsConflictsWithoutReplacingRelease"
    title: "新发布不改旧目录与字节，重叠目标被拒绝且保留已接受版本"
    verifies:
      - claim: "dataset#U2"
        detail: "源 HEAD 前进后旧 pin 按旧路径与字节继续服务，新发布被接受后新请求采用新布局；重叠交付路径的候选以 KNOWLEDGE_SET_INVALID 拒绝，已接受版本与 revision 不被失败候选占用。"
      - claim: "dataset#U9"
        detail: "调整交付路径发布新版后，已打开的旧视图继续按旧路径工作，新旧布局与字节不串用。"
  - source: "dataset.compose"
    views:
      - "consumption"
    tests:
      - "TestDatasetCloneJourney"
    title: "kc dataset clone 经公开 argv 把交付目录树物化为普通本地目录，非空目标被拒绝"
  - source: "dataset.compose"
    views:
      - "consumption"
      - "access-control"
    tests:
      - "TestDatasetDeliveryRejectsReadsAfterGrantRevocation"
    id: "dataset-delivery-rejects-reads-after-revocation"
    title: "撤权后同一 pin 的挂载、枚举、挂载相对与交付寻址读取全部拒绝，他人授权不受影响"
    verifies:
      - claim: "dataset#U3"
        detail: "授权→发布→pin 内枚举读取通过→经管理面撤权后，同一 pin 的 mounts、目录枚举、挂载相对与交付寻址读取全部返回 FORBIDDEN，且其它主体的授权不受影响。"
  - source: "dataset.compose"
    views:
      - "consumption"
    tests:
      - "TestDatasetFileDeliveryServesRenamedAndMixedEntries"
      - "TestDatasetFileDeliveryRejectsContentConflicts"
      - "TestDatasetCloneMaterializesDeliveredTree"
    id: "dataset-file-delivery-mixed-entries-and-conflicts"
    title: "逐文件挑选、改名与跨仓混排交付同一目标目录；目标冲突拒绝；clone 物化交付树"
    verifies:
      - claim: "dataset#U10"
        detail: "从不同仓逐文件挑选并分别指定目标名，只枚举与读取选中文件，交付路径不扩大范围（含 ../ 上跳拒绝），旧 pin 重放仍读已接受交付树；同目标内容冲突以 KNOWLEDGE_SET_INVALID 拒绝且不被枚举；kc dataset clone 物化交付树并拒绝非空目标。"
  - source: "projection.index"
    views:
      - "publication"
      - "consumption"
    tests:
      - "TestSearchAtDoesNotRewindLive"
      - "TestIndexSchemaChangeForcesRebuild"
      - "TestCompiledDocumentDoesNotCarryWorkspaceScope"
    title: "切换查询版本不回退实时投影，Schema 变化要求重建且索引不混入 Workspace 范围"
  - source: "knowledge.relations"
    views:
      - "consumption"
    tests:
      - "TestRelationRepositoryWorkspaceAndHTTPUseOneExactBasisExecutor"
      - "TestRelationsWithoutIndexNeverFallsBackToAuthorityScan"
    title: "关系查询共享精确版本基线，无索引时拒绝回退扫描"
  - source: "knowledge.traverse"
    views:
      - "consumption"
    tests:
      - "TestTraverseNeighborhoodClosureAcrossChannels"
    title: "有界邻域闭包：repo/dataset/HTTP 三通道一致，跳顶与范围外边界显式，分页为闭包增量"
  - source: "dataset.compose"
    views:
      - "consumption"
    tests:
      - "TestT11FederatedReadDoesNotOverride"
    title: "联邦读取保留不同仓中的同名对象"
  - source: "dataset.compose"
    views:
      - "consumption"
    tests:
      - "TestDatasetFileDeliveryMapsSameNameFilesToDistinctTargets"
    title: "两个来源的同名文件映射到不同目标，交付字节与来源身份保留"
    verifies:
      - claim: "dataset#U1"
        detail: "两仓同名文件按 per-file 条目映射到不同目标位置，只枚举读取选中范围，pin 条目保留各自来源仓与冻结 commit；未选中的相邻文件不出现。"
  - source: "dataset.compose"
    views:
      - "consumption"
    tests:
      - "TestDatasetRepublishWithVanishedSelectorKeepsAcceptedVersion"
    title: "来源版本不可用时发布被拒，已接受版本继续服务"
    verifies:
      - claim: "dataset#U2"
        detail: "selector 指向已消失 ref 的发布以 KNOWLEDGE_SET_INVALID 拒绝，当前 pin 的 revision/PinID 不动、字节继续服务；换回有效 selector 后新版正常发布，旧 pin 不漂移。"
  - source: "dataset.compose"
    views:
      - "consumption"
      - "lifecycle"
    tests:
      - "TestDatasetRetireRejectsConsumptionAndPreservesSources"
    title: "退役按当前生命周期拒绝消费与再发布，不偷删源内容"
    verifies:
      - claim: "dataset#U4"
        detail: "退役后 latest 解析以 KNOWLEDGE_SET_INVALID 拒绝、pin 读在授权门拒绝（退役前同 pin 同主体读成功的对照在案）、再发布被拒；源仓 HEAD/提交不变、源字节原样可读，同来源仍支撑全新 Dataset 的完整交付。"
  - source: "dataset.compose"
    views:
      - "consumption"
    tests:
      - "TestDatasetConcurrentPublishersCannotOverwriteOrRollBack"
    title: "并发发布同一 revision 恰好一个接受，清单始终完整"
    verifies:
      - claim: "dataset#U5"
        detail: "两个发布流并发发布 v2 恰好一个接受、另一方 NonFastForward；当前清单要么全目录要么全条目（无半份混合）；回滚 revision 被拒；旧 pin 不漂移；落选方换新 revision 重试后被接受。"
  - source: "dataset.compose"
    views:
      - "consumption"
    tests:
      - "TestDeliveredReferenceDoesNotPullUnselectedFile"
    title: "已交付文件的内容引用不补齐未选中文件"
    verifies:
      - claim: "dataset#U6"
        detail: "交付文件正文引用同子树的未选中文件时，交付命名空间只列选中文件；读取被引用路径不返回内容也不补齐。"
  - source: "dataset.compose"
    views:
      - "consumption"
    tests:
      - "TestDatasetDeliveryWithoutKnowledgeLayerKeepsPlainBytes"
    title: "没有知识层的纯文件交付逐字节保持原样"
    verifies:
      - claim: "dataset#U7"
        detail: "来源只有普通文本、无知识声明与查询投影时发布与读取成立；含 origin/URL 文本的文件逐字节原样交付（origin 指向不可路由端口，任何取值尝试都会失败），交付条目保留冻结 commit。"
fixture: "scene-notes 第 1 版已固定 knowledge 仓含 note/hello 的主分支提交。"
probes:
  - file: "probe-publish-next-dataset-revision.feature"
    source: "dataset.compose"
    views:
      - "lifecycle"
    title: "发布下一版 Dataset 并确认成员固定到 commit"
