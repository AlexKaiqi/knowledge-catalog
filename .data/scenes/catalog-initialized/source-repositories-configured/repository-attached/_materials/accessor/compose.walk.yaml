# 走查：挂到 deploy-local 网，对着刚 create 的托管仓。
# 协议 construct 仍用 origin :9，不读本文件。
name: kc-scene-accessor

services:
  mysql:
    image: mysql:8.4.8@sha256:2952e3be7807f06fc18de50b3ea1a632d5c70d63482ff7d7376fe3aa8999babf
    environment:
      MYSQL_ROOT_PASSWORD: shop-walk
      MYSQL_DATABASE: shop
      TZ: UTC
    command:
      - --mysql-native-password=ON
      - --authentication-policy=mysql_native_password
      - --local-infile=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --server-id=1001
    ports:
      - "127.0.0.1:13306:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  resource-access:
    environment:
      KC_MYSQL_HOST: mysql
      KC_MYSQL_PORT: "3306"
      KC_MYSQL_USER: root
      KC_MYSQL_PASSWORD: shop-walk
      KC_MYSQL_DATABASE: shop
    depends_on:
      mysql:
        condition: service_healthy
    volumes: !override
      - ./source.walk.json:/data/source.json

  collector:
    environment:
      KC_SERVER_URL: http://kc-server:7380
      KC_CATALOG: ${KC_CATALOG:-kr://acme/catalog}
      KC_AS: ${KC_AS:-admin}
      KC_REPOSITORY: ${KC_REPOSITORY:-table-meta}
      KC_COLLECTOR_WRITE: "1"
      KC_MYSQL_HOST: mysql
      KC_MYSQL_PORT: "3306"
      KC_MYSQL_USER: root
      KC_MYSQL_PASSWORD: shop-walk
      KC_MYSQL_DATABASE: shop
    depends_on:
      mysql:
        condition: service_healthy
    ports: !override
      - "127.0.0.1:17491:7391"
    volumes: !override
      - ./source.walk.json:/data/source.json
      - ${KC_WALK_KC}:/usr/local/bin/kc:ro

  observer:
    environment:
      KC_SERVER_URL: http://kc-server:7380
      KC_CATALOG: ${KC_CATALOG:-kr://acme/catalog}
      KC_AS: ${KC_AS:-admin}
      KC_NOTICE_REPOSITORY: ${KC_NOTICE_REPOSITORY:-${KC_REPOSITORY:-table-meta}}
      KC_NOTICE_ASPECT: stats
      KC_MYSQL_HOST: mysql
      KC_MYSQL_PORT: "3306"
      KC_MYSQL_USER: root
      KC_MYSQL_PASSWORD: shop-walk
      KC_MYSQL_DATABASE: shop
    depends_on:
      mysql:
        condition: service_healthy
    ports: !override
      - "127.0.0.1:17492:7392"
    volumes: !override
      - ./source.walk.json:/data/source.json

networks:
  default:
    name: ${KC_ACCESSOR_NETWORK:-kc-deploy-local_default}
    external: true
