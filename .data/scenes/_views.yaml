      U1: 尚未证明丢通知后的查询范围级覆盖与时效，尤其是零命中、过期响应与分页期间后台更新的组合。
      U2: 已有取值、空值与失败的局部断言；尚未证明刷新失败后旧观察是否满足请求时效，以及信号载荷不能替代缺失取值能力的完整交付旅程。
      U3: 现有 notice 测试只证明显式通知后重新取值与 Snapshot 不变；不证明丢失、重复、乱序、断档和替换进程后的恢复。
      U4: 尚无 latest-only 观察跨更新与重启保留、保留期内丢失、正常到期以及历史重读不回退 latest 的完整证据。
      U5: 已有发布范围和声明版本检查；未证明 HEAD 前进后旧 Dataset 声明的独立维护、动态就绪及旧 runtime 退役处理。
      U6: 尚未证明后台身份可见而消费方不可见、撤权后旧观察拒绝，以及接入方显式授权共享观察的交付边界。
      U7: 现有测试只证明身份透传、凭证不进请求正文与缺主体拒绝；目标信任、凭证适用范围、重定向和后台身份隔离尚无证据。
      U8: 现有增量测试只证明单对象重取次数与新值可检索；未证明观察复制、摘要与索引写入的整体成本，或失败来源不阻塞独立工作；整体成本判据由 index-control#U2 统一说明。
      U9: 普通 READ 拒绝 Stream 已有局部证据；有界窗口、顺序、迟到、保留缺口与持续订阅属于后续设计，尚无可执行入口。
views:
  access-control:
    title: 接入与授权
    description: 部署、身份、仓接入与独立授权边界；查看哪些条件允许发现、读取和写入。
  publication:
    title: 知识发布
    description: 从已接入仓出发，查看 Schema、知识写入、声明式投影和接入方资源声明。
    entry: repository-attached
  consumption:
    title: 消费与走查
    description: Schema 发现、固定版本组合、检索读取与清河茶铺完整消费任务。
  lifecycle:
    title: 治理与恢复
    description: 提案维护、撤权、归档、退役、投影更新与替换实例后的恢复。
