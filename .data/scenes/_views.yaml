product_documents:
  object:
    section: 用例
    gaps:
      U1: 现有非法声明用例同时含未知 type 与 access，尚未分别证明两类声明都会被拒绝且 HEAD 不变；缺字段用例未单独钉 HEAD 不变，场景成功回读也未同时核对写回执 commit 与 schema_ref；同批成功分支尚未分别回读 Schema 与实例并断言二者属于同一 commit。
      U3: breaking 迁移分支仍待决策；局部兼容性与重建测试不证明完整演进旅程。
      U7: 尚无现行场景绑定与执行证据。
      U8: 已覆盖认证读取、文件交付、help 同源与出版物漂移拒绝；尚未执行真实 Agent 从任务说明自主选择能力和处理就绪或授权失败的语义验收。
  dataset:
    section: 用例
    gaps:
      U8: 现有服务端 plan 与 Gateway 证据未证明已有项目中的一次 Resolve、用户确认后只读挂载与原文件保持不变的完整交互。
      U11: 验收规格已定义（qinghe accept-*）；来源跟随方式、分支前进自动发修订与合并中间提交、自动发布失败保留当前修订、撤销发布许可停止跟随尚无实现与执行入口。
      U12: 验收规格已定义（qinghe accept-*）；修订检索保留策略、超出保留报检索已不可用、退役修订与当前修订不可退役尚无实现与执行入口；现有代际切换只为续页保留固定宽限。
      U13: 验收规格已定义（qinghe accept-*）；修订对来源提交的保留与 lakeFS 回收规则检查尚无实现与执行入口。
      U14: 验收规格已定义（qinghe accept-*）；按 Dataset 的配额与自动发布最小间隔尚无实现与执行入口。
      U15: 验收规格已定义（qinghe accept-*）；紧急清除（共用索引按对象重写、证据观察值替换为已清除）尚无实现与执行入口。
      U16: 当前发布仍要求调用方指定 revision，尚无服务端分配版本号、无变化定义不产生新号及请求内固定 latest 的完整用例关联；由 DATASET-REVISION-01 承接。
      U17: 两个已发布版本的指针与元数据差异查询尚无公开执行入口及验证关联；来源不可用时保留差异并报告状态的路径亦未证明，由 DATASET-REVISION-01 承接。
  service:
    section: 用例
    gaps:
      U2: 尚无现行场景绑定与执行证据。
      U3: Gateway 用例未显式核对 YAML 中的 Repository 与 commit，没有真实 Agent 经语义文件挂载执行 rg 的完整旅程，界面隐藏入口保持挂载、pin、权限和 Agent 访问不变也没有具体验证。
      U4: 尚无现行场景绑定与执行证据。
      U5: 现有关联未完整证明发现响应的 basis、coverage 与权限裁剪要求。
      U6: 当前场景没有连接状态零扫描、从插件到 authority 的分段耗时、分页与本机 p95 100ms 目标的同次运行证据。
  affordance:
    section: 用例
    gaps:
      U1: 现有关联未完整证明封装客户端登录与 README 的 SEARCH。
      U2: 尚未建立 .data/scenes 旅程绑定。
      U3: 尚未建立 .data/scenes 旅程绑定。
      U4: 尚未建立 .data/scenes 旅程绑定。
      U5: 尚未建立 .data/scenes 旅程绑定。
      U6: 尚未建立 .data/scenes 旅程绑定。
      U7: 验收规格已定义（qinghe accept-*）；插件实例公开带版本能力清单与试运行入口尚待选定公开合同，已有发现入口不证明这些能力。
      U8: 新增基础帮助到目标插件说明的方向用例尚无具名场景关联；离线帮助、Repo/Dataset 实际选用说明与模块帮助的完整走读仍需独立验收。
  liveaccess:
    section: 用例
    gaps:
      U1: 尚未证明丢通知后的查询范围级覆盖与时效，尤其是零命中、过期响应与分页期间后台更新的组合。
      U2: 已有取值、空值与失败的局部断言；尚未证明刷新失败后旧观察是否满足请求时效，以及信号载荷不能替代缺失取值能力的完整交付旅程。
      U3: 现有 notice 测试只证明显式通知后重新取值与 Snapshot 不变；不证明丢失、重复、乱序、断档和替换进程后的恢复。
      U4: 尚无 latest-only 观察跨更新与重启保留、保留期内丢失、正常到期以及历史重读不回退 latest 的完整证据。
      U5: 已有发布范围和声明版本检查；未证明 HEAD 前进后旧 Dataset 声明的独立维护、动态就绪及旧 runtime 退役处理。
      U6: 尚未证明后台身份可见而消费方不可见、撤权后旧观察拒绝，以及接入方显式授权共享观察的交付边界。
      U7: 现有测试只证明身份透传、凭证不进请求正文与缺主体拒绝；目标信任、凭证适用范围、重定向和后台身份隔离尚无证据。
      U8: 现有增量测试只证明单对象重取次数与新值可检索；未证明观察复制、摘要与索引写入的整体成本，或失败来源不阻塞独立工作；整体成本判据尚未写入用例。
      U9: 普通 READ 拒绝 Stream 已有局部证据；有界窗口、顺序、迟到、保留缺口与持续订阅属于后续设计，尚无可执行入口。
      U10: 尚无同一 Dataset 按各来源固定声明聚合索引与访问实例、动态索引显式桥接来源访问实例，以及不相容共享观察拒绝混用的执行旅程；现有固定检索和身份透传不能证明来源匹配合同。
      U11: 尚无重启后改选 LiveAccess 实例仍访问固定 origin、使用新实例自身执行身份，以及不支持声明时明确失败的证据；已有部署恢复不证明访问实例替换。
      U12: 旧 State Binding 与 ResourceDescriptor 已有局部执行合同；尚无所选 LiveAccess 实例承接兼容声明及不支持实现版本时在调用源前拒绝、且不回退或扫描替代声明的完整旅程。
      U21: 验收规格与测试源已就位（qinghe accept-*、acceptance/live-origin）；方面级与成员级取值声明、混合值原位读取和双声明拒绝已有组件断言；尚无场景旅程同时证明成员失败只影响该成员、观察依据按地址列在值旁、固定版本不受 HEAD 改 origin 影响。
      U22: 验收规格已定义（qinghe accept-*）；取值描述 identity、只有 shared 进索引、命中回读补判与旧修订不刷新外部值尚无实现与执行入口。
      U23: 验收规格已定义（qinghe accept-*）；跨仓取值描述按引用版本解析、请求总时限截断与 origin 精确匹配尚无执行证据。
  discovery:
    section: 用例
    gaps:
      U1: 验收规格已定义；已有字段原语与标量类型断言，新插件公开查询入口仍待接入。
      U2: 验收规格已定义（qinghe accept-*）；已有范围、授权及组合原语断言。插件只由部署安装、未装插件报没有检索能力、部署拒绝清单名歧义与按仓选择已有 Go 断言（home/deployment_plugins_test.go）；只以 Dataset 为检索空间、不带 Dataset 拒绝与索引声明按清单名路由尚无执行证据。
      U3: 验收规格已定义；已有增量等价重建及控制器恢复断言，新插件的维护实例选用与重启恢复旅程仍待接入。
      U4: 已有 Repo 候选与对象回读竞态；本轮补 Dataset 查询中途切版、冻结/接受失败及准备后取消。新插件完整来源准备/查询/回读链仍待接入，不以组件通过代替插件验收。
      U5: 验收规格已定义；已有坏坐标/依据与分页代际变化拒绝，跨插件实例的原依据续页尚待接入。
      U6: 已有消费者隔离及维护 worker 关闭等待；通知不得改后台来源/身份的既有回归当前失败。同一 OpenSearch 的两插件实例物理隔离、故障、登记/初始需求失败逆序清理、业务请求排空与资源只释放一次仍待真实宿主接线。
      U7: 验收规格已定义（qinghe accept-*）；index 方面经 Writer 校验、只有选进 Dataset 的声明生效、多输入拼接与 Schema 删字段后成员失效尚无执行入口，待对象模型重构后接成 probe。
      U8: 验收规格已定义（qinghe accept-*）；带版本能力清单、试运行无副作用、清单外成员逐个标为不支持与是否重建尚无公开入口与执行证据。
      U9: 验收规格已定义（qinghe accept-*）；查询、回读、采纳按成员归因与汇总、缺失需求只作数据公开且不写分支尚无执行入口。
      U10: 验收规格已定义（qinghe accept-*）；从服务库存按消费权限列出 Dataset 及用途说明再搜索尚无执行入口。
views:
  access-control:
    title: 接入与授权
    description: 部署、身份、仓接入与独立授权边界；查看哪些条件允许发现、读取和写入。
  publication:
    title: 对象发布
    description: 从已接入仓出发，查看 Schema、对象写入、声明式投影和接入方资源声明。
    entry: repository-attached
  consumption:
    title: 消费与走查
    description: Schema 发现、固定版本组合、检索读取与清河茶铺完整消费任务。
  lifecycle:
    title: 治理与恢复
    description: 工作分支合并、撤权、归档、退役、投影更新与替换实例后的恢复。
