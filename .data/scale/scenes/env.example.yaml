# 压测环境配置模板（形状合同；真实配置不提交，凭证值永不写入本文件）
# 执行器只读取本文件并绑定一个已就绪的 KC 环境；不启动、不编排任何容器或服务。
# 校验：python3 .data/scale/scenes/perf_tree.py --env <file>
run:
  runId: auto                        # auto=按 UTC 生成；显式指定用于复算
  evidenceDir: "../runs"             # 相对本文件；证据写 <evidenceDir>/<runId>/
target:
  serverURL: "http://127.0.0.1:7380" # KC Server 公开入口，唯一施压面
  credentialsEnv: KC_PERF_TOKEN      # 凭证环境变量引用名；形状必须是 NAME，不是值
  catalog: "kr://catalog/main"       # 目标 Catalog id（部署方提供）
  principal: kc-perf                 # 压测主体；部署方预建并授予所需 grants
  setupAllowCreate: true             # 允许 runner 经公开 create 供给 scratch 仓；false 时全部用既有仓
  repositoryPrefix: "kc-perf-"       # 本 run 创建的仓前缀；cleanup 依据
profile:
  scale: S1                          # S0..S5，见 docs/reviewed/scale-benchmark.md §2.3
  history: H0                        # H0..H4；history-aged 节点需要
  ladders:                           # 量级阶梯（曲线自变量缺省值；可整段覆盖）
    uploadFileCount: [1, 10, 100, 1000, 10000, 100000]
    objectSizeBytes: [1024, 65536, 1048576, 33554432, 134217728]
    commitBatchFiles: [10, 100, 1000, 5000]
    readManySize: [10, 50, 100, 500]
    deliveredObjectCount: [100, 1000, 10000, 100000]
    commitGap: [1, 100, 10000]
    searchConcurrency: [1, 8, 32]
    historyDepth: [H0, H1, H2, H3, H4]
load:
  arrivalModel: closed-loop          # closed-loop | open-loop（open-loop 需能力 arrival-models）
  warmup: 10m
  measure: 30m
  cooldown: 10m
  steadyEventsPerDay: 10000
limits:
  generatorCPUPercent: 70            # 持续达到即 INVALID
  diskUtilizationStop: 0.85          # 达到即停止加压并判 FAILED
  maxInFlight: 32                    # 单探针并发上界
observability:                       # 全部可选且只读；留空跳过
  prometheusURL: ""
  lakefsURL: ""                      # 快照介质只读运维检查（版本/容量快照）
  opensearchURL: ""                  # 索引健康与容量快照（只读）
cleanup:
  scratchRepositories: delete        # delete | retain（retain 仍需写入清理责任人与期限）
