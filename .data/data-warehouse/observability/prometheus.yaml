global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: knowledge-catalog
    metrics_path: /metrics
    # Prometheus 3 otherwise prefers protobuf and preserves OTel dotted
    # instrument names. The KC exposition contract and recording rules use the
    # stable Prometheus text names (kc_search_*).
    scrape_protocols: [PrometheusText0.0.4]
    metric_name_validation_scheme: legacy
    metric_name_escaping_scheme: underscores
    static_configs:
      - targets: [kc-server:7380]
