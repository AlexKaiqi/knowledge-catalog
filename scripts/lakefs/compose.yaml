# Local lakeFS Snapshot topology for KC: Graveler control plane + S3-compatible
# data plane. MinIO stands in for COS; swap blockstore endpoint/credentials to
# point at a real bucket. KC Server runs on the host and follows presigned URLs
# at 127.0.0.1:${KC_MINIO_PORT}.
name: kc-system-lakefs

services:
  minio-init:
    image: ${KC_BUSYBOX_IMAGE:-busybox:1.36}
    volumes:
      - minio-data:/data
    command: ["mkdir", "-p", "/data/kc-authority"]
    restart: "no"

  minio:
    image: ${KC_MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    command: ["server", "/data", "--console-address", ":9001"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KC_MINIO_PORT}:9000"
    environment:
      MINIO_ROOT_USER: ${KC_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${KC_MINIO_PASSWORD}
    volumes:
      - minio-data:/data

  lakefs:
    image: ${KC_LAKEFS_IMAGE:-treeverse/lakefs:1.86.0}
    depends_on:
      minio:
        condition: service_started
    ports:
      - "127.0.0.1:${KC_LAKEFS_PORT}:8000"
    environment:
      LAKEFS_DATABASE_TYPE: local
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000
      LAKEFS_BLOCKSTORE_S3_DISCOVER_BUCKET_REGION: "false"
      LAKEFS_BLOCKSTORE_S3_PRE_SIGNED_ENDPOINT: http://127.0.0.1:${KC_MINIO_PORT}
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: ${KC_MINIO_USER}
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: ${KC_MINIO_PASSWORD}
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: ${KC_LAKEFS_ENCRYPT_KEY}
      LAKEFS_STATS_ENABLED: "false"
      LAKEFS_LOGGING_LEVEL: INFO
    volumes:
      - lakefs-kv:/home/lakefs

volumes:
  minio-data:
  lakefs-kv:
