# Overlay for grafana/otel-lgtm: keep native OTLP ingest and scrape KC /metrics.
# KC exposition uses Prometheus text names (kc_search_*); do not let Prometheus 3
# rewrite them to dotted OTel names.
global:
  scrape_native_histograms: true
  scrape_interval: 5s
  evaluation_interval: 5s

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database
    - kafka.cluster.alias

storage:
  tsdb:
    out_of_order_time_window: 10m

rule_files:
  - /otel-lgtm/rules/*.yaml

scrape_configs:
  - job_name: knowledge-catalog
    metrics_path: /metrics
    scrape_protocols: [PrometheusText0.0.4]
    metric_name_validation_scheme: legacy
    metric_name_escaping_scheme: underscores
    static_configs:
      - targets: [kc-server:7380]
  - job_name: otel-collector
    metrics_path: /metrics
    scrape_protocols: [PrometheusText0.0.4]
    metric_name_validation_scheme: legacy
    metric_name_escaping_scheme: underscores
    static_configs:
      - targets: [127.0.0.1:8888]
