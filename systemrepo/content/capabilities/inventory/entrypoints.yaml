path_hint: capabilities/inventory/entrypoints.yaml
schema_ref: schema/system/capability-entrypoints/v1
---
{
  "commands": [
    {
      "action": "inventory.read",
      "command": "kc dataset show",
      "description": "查看 Dataset 已接受发布的定义、来源、元数据与一页历史",
      "help": "kc help dataset show"
    },
    {
      "action": "inventory.read",
      "command": "kc plugin",
      "description": "读取插件说明、实例能力清单或只读试运行声明",
      "help": "kc help plugin"
    },
    {
      "action": "registry.audit.read",
      "command": "kc registry audit",
      "description": "查看服务登记历史",
      "help": "kc help registry audit"
    },
    {
      "action": "inventory.read",
      "command": "kc show",
      "description": "显示服务的 Repository 与 Dataset 库存",
      "help": "kc help show"
    }
  ]
}
