---
object_id: kc/capability/governance
aspect_name: entrypoints
kind: Aspect
path_hint: capabilities/governance/entrypoints.yaml
schema_ref: schema/system/capability-entrypoints/v1
---
{
  "commands": [
    {
      "action": "governance.preview.create",
      "command": "kc governance preview create",
      "description": "把 proposal 叠到本次解析的 Dataset 上，给出 candidate 坐标，不改 main",
      "help": "kc help governance preview create"
    },
    {
      "action": "governance.validate",
      "command": "kc governance preview validate",
      "description": "校验 Preview 的协议结构",
      "help": "kc help governance preview validate"
    },
    {
      "action": "governance.proposal.create",
      "command": "kc governance proposal create",
      "description": "把变更写到 candidate 并打开 Proposal，不推进 target",
      "help": "kc help governance proposal create"
    },
    {
      "action": "governance.merge",
      "command": "kc governance proposal merge",
      "description": "合入 Proposal",
      "help": "kc help governance proposal merge"
    },
    {
      "action": "governance.validation.record",
      "command": "kc governance validation record",
      "description": "记录外部套件结果",
      "help": "kc help governance validation record"
    }
  ]
}
